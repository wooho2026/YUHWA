
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>留華 | 850년의 기록</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>
:root{
  --bg:#0d0c10;
  --ivory:#eee7dc;
  --muted:#c9beb2;
  --gold:#b99a75;
}
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}
body{
  color:var(--ivory);
  font-family:"Maru Buri","Malgun Gothic",serif;
}
button{font:inherit;cursor:pointer}

.screen{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:30px;
  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );
}
.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}
.content{
  position:relative;
  z-index:2;
  width:100%;
}
.hidden{display:none!important}

/* 유화 메인 붓글씨 */

.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(0 0 22px #d8bda426);
}
.subtitle{
  font-size:15px;
  font-weight:400;
  letter-spacing:2px;
  color:#c4b29e;
  margin-top:20px;
}

/* 본문 */

.quote{
  margin-top:28px;
  font-size:14px;
  font-weight:400;
  line-height:1.7;
  color:var(--muted);
  word-break:keep-all;
}

/* ===================================
   V7 꽃잎 분리 버튼
=================================== */

.flower-enter{
  display:inline-grid;
  place-items:center;
  position:relative;
  width:218px;
  height:218px;
  margin-top:18px;
  padding:0;
  border:0;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
}

/* 꽃 주변의 희미한 빛 */

.flower-enter::before{
  content:"";
  position:absolute;
  width:165px;
  height:165px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(244,226,202,.12),
    rgba(224,195,161,.035) 45%,
    transparent 75%
  );
  pointer-events:none;
  transition:opacity .7s;
}
.flower-enter:hover::before{
  opacity:.35;
}

/* Canvas는 꽃과 떨어지는 꽃잎을 그린다 */

#petalCanvas{
  display:block;
  width:218px;
  height:218px;
  pointer-events:none;
}

/* 이미지를 불러오기 전 표시하는 꽃 */

.flower-fallback{
  display:block;
  position:absolute;
  width:155px;
  height:155px;
  object-fit:contain;
  pointer-events:none;
}

.flower-enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:4px;
}

/* ===================================
   기록 보관소
=================================== */

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:28px;
}
.archive-title{
  font-size:65px;
  font-weight:400;
  color:#e9ddc8;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:760px;
  margin:40px auto 0;
}
.card{
  border:1px solid #66594c;
  padding:35px 12px;
  background:#ffffff05;
  min-height:160px;
  transition:background .3s,border-color .3s;
}
.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
}
.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}
.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#bba992;
}
.card p{font-size:13px}
.note{
  font-size:11px;
  color:#8c8076;
  margin-top:35px;
}

/* 돌아가기 */

.enter{
  display:inline-flex;
  align-items:center;
  gap:22px;
  margin-top:43px;
  padding:19px 32px;
  position:relative;
  border:0;
  background:transparent;
  color:#e9d8c2;
  font-size:15px;
  letter-spacing:4px;
  overflow:hidden;
  transition:color .5s,letter-spacing .5s;
}
.enter::before,
.enter::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,transparent,#b99a75,transparent
  );
  transition:left .6s,right .6s;
}
.enter::before{top:0}
.enter::after{bottom:0}
.enter:hover{
  color:#fff6e7;
  letter-spacing:6px;
  text-shadow:0 0 16px #e6c69c80;
}
.enter:hover::before,
.enter:hover::after{
  left:0;
  right:0;
}
.enter .arrow{
  font-family:Arial,sans-serif;
  color:#bda181;
}
.enter:focus-visible{
  outline:1px solid #d9b78f;
}

/* 화면 전환 */

#entrance,#archive{
  transition:opacity 1.1s ease;
}
#archive{opacity:0}
#archive.visible{opacity:1}
#entrance.fading{opacity:0}

/* 모바일 */

@media(max-width:600px){
  .screen{padding:35px 25px}
  .title-image{
    height:clamp(210px,38vh,330px);
  }
  .subtitle{font-size:14px}
  .quote{
    font-size:13px;
    line-height:1.6;
  }
  .flower-enter{
    width:190px;
    height:190px;
    margin-top:12px;
  }
  #petalCanvas{
    width:190px;
    height:190px;
  }
  .flower-fallback{
    width:135px;
    height:135px;
  }
  .cards{
    grid-template-columns:1fr;
    max-width:290px;
  }
}

@media(prefers-reduced-motion:reduce){
  #entrance,#archive{
    transition-duration:.01s;
  }
}
</style>
</head>

<body>

<!-- 첫 화면 -->

<section class="screen" id="entrance">
  <div class="content">

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華"
    >

    <div class="subtitle">
      850년의 기록
    </div>

    <div class="quote">
      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>
      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.
    </div>

    <!-- 꽃 클릭으로 입장 -->

    <button
      class="flower-enter"
      id="flowerButton"
      type="button"
      onclick="openDoor()"
      aria-label="꽃을 눌러 기록 보관소 열기"
      title="기록 보관소 열기"
    >

      <img
        class="flower-fallback"
        id="flowerFallback"
        src="flower.png"
        alt=""
      >

      <canvas
        id="petalCanvas"
        width="218"
        height="218"
        aria-hidden="true"
      ></canvas>

    </button>

  </div>
</section>

<!-- 기록 보관소 -->

<section class="screen hidden" id="archive">
  <div class="content">

    <div class="eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <div class="archive-title">
      留華
    </div>

    <div class="subtitle">
      이제야 보여줄 수 있는 것들
    </div>

    <div class="cards">

      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="enter"
      type="button"
      onclick="closeDoor()"
    >
      돌아가기
      <span class="arrow">↗</span>
    </button>

  </div>
</section>

<script>

/* ===================================
   꽃잎 애니메이션
=================================== */

const canvas=document.getElementById("petalCanvas");
const ctx=canvas.getContext("2d");
const flowerButton=document.getElementById("flowerButton");
const fallback=document.getElementById("flowerFallback");

const image=new Image();
image.src="flower.png";

const SIZE=218;
const FLOWER_SIZE=158;
const FLOWER_X=(SIZE-FLOWER_SIZE)/2;
const FLOWER_Y=FLOWER_X;
const CENTER=SIZE/2;

const motionReduced=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

/*
 꽃잎을 원본 PNG에서
 타원형 조각으로 분리한다.
*/

const petals=[];

/* 바깥쪽 꽃잎 18장 */

for(let i=0;i<18;i++){

  const angle=(i/18)*Math.PI*2;

  petals.push({
    x:CENTER+Math.cos(angle)*54,
    y:CENTER+Math.sin(angle)*54,
    angle:angle+Math.PI/2,
    rx:10,
    ry:19,
    delay:i*0.033,
    drift:Math.cos(angle)*42,
    fall:35+(i%5)*12,
    spin:(i%2===0?1:-1)*(0.6+i%4*.18)
  });
}

/* 안쪽 꽃잎 12장 */

for(let i=0;i<12;i++){

  const angle=(i/12)*Math.PI*2+0.18;

  petals.push({
    x:CENTER+Math.cos(angle)*34,
    y:CENTER+Math.sin(angle)*34,
    angle:angle+Math.PI/2,
    rx:8,
    ry:15,
    delay:.42+i*.034,
    drift:Math.cos(angle)*29,
    fall:32+(i%4)*10,
    spin:(i%2===0?-1:1)*.65
  });
}

/*
 progress = 0 : 원래 꽃
 progress = 1 : 꽃잎 분리 완료
*/

let progress=0;
let hovering=false;
let running=false;
let lastTime=0;

function petalShape(context,p){

  context.translate(p.x,p.y);
  context.rotate(p.angle);

  context.beginPath();
  context.ellipse(
    0,0,p.rx,p.ry,0,0,Math.PI*2
  );
}

/* 분리된 꽃잎의 진행 정도 */

function petalProgress(p){

  const span=.50;

  return Math.max(
    0,
    Math.min(1,(progress-p.delay)/span)
  );
}

/* 부드러운 가속과 감속 */

function ease(t){
  return t*t*(3-2*t);
}

/* 꽃잎이 빠진 원본 꽃 */

function drawRemainingFlower(){

  ctx.save();

  ctx.drawImage(
    image,
    FLOWER_X,FLOWER_Y,
    FLOWER_SIZE,FLOWER_SIZE
  );

  /*
    원본 꽃에서 분리된 꽃잎 부분을
    투명하게 지운다.
  */

  ctx.globalCompositeOperation="destination-out";

  petals.forEach(p=>{

    const t=petalProgress(p);

    if(t<=0)return;

    ctx.save();

    petalShape(ctx,p);

    ctx.fillStyle=`rgba(0,0,0,${ease(t)})`;
    ctx.fill();

    ctx.restore();
  });

  ctx.restore();
}

/* 날아가는 꽃잎 조각 */

function drawFlyingPetals(){

  petals.forEach((p,i)=>{

    const raw=petalProgress(p);

    if(raw<=0)return;

    const t=ease(raw);

    const sway=Math.sin(t*7+i)*9*t;
    const dx=p.drift*t+sway;
    const dy=p.fall*t+38*t*t;

    ctx.save();

    ctx.globalAlpha=
      Math.min(1,t*5)*(1-t*.85);

    /*
      먼저 원래 꽃잎 위치로 이동한 뒤
      떨어지는 방향으로 변환한다.
    */

    ctx.translate(p.x+dx,p.y+dy);

    ctx.rotate(p.angle+p.spin*t);

    ctx.scale(
      1-.25*t,
      1-.12*t
    );

    ctx.beginPath();

    ctx.ellipse(
      0,0,p.rx,p.ry,
      0,0,Math.PI*2
    );

    ctx.clip();

    /*
      꽃 원본에서 해당 꽃잎 부분을
      그대로 잘라 그린다.
    */

    ctx.rotate(-p.angle);

    ctx.drawImage(
      image,
      FLOWER_X-p.x,
      FLOWER_Y-p.y,
      FLOWER_SIZE,
      FLOWER_SIZE
    );

    ctx.restore();
  });
}

/* 전체 그림 갱신 */

function renderFlower(){

  ctx.clearRect(0,0,SIZE,SIZE);

  if(!image.complete||!image.naturalWidth){
    return;
  }

  drawRemainingFlower();
  drawFlyingPetals();
}

/* 프레임 처리 */

function animate(timestamp){

  if(!running)return;

  if(!lastTime)lastTime=timestamp;

  const dt=Math.min(
    (timestamp-lastTime)/1000,
    .04
  );

  lastTime=timestamp;

  const target=hovering?1:0;

  /*
    꽃잎이 흩날리는 속도와
    돌아오는 속도를 따로 설정
  */

  const speed=hovering?.40:1.4;

  if(progress<target){
    progress=Math.min(
      target,
      progress+dt*speed
    );
  }

  if(progress>target){
    progress=Math.max(
      target,
      progress-dt*speed
    );
  }

  renderFlower();

  if(progress!==target){
    requestAnimationFrame(animate);
  }else{
    running=false;
    lastTime=0;
  }
}

function startAnimation(){

  if(motionReduced)return;

  if(running)return;

  running=true;
  lastTime=0;
  requestAnimationFrame(animate);
}

/* PC에서 마우스를 올렸을 때 */

flowerButton.addEventListener(
  "pointerenter",
  e=>{
    if(e.pointerType==="mouse"){
      hovering=true;
      startAnimation();
    }
  }
);

/* 마우스를 떼면 꽃 복원 */

flowerButton.addEventListener(
  "pointerleave",
  e=>{
    if(e.pointerType==="mouse"){
      hovering=false;
      startAnimation();
    }
  }
);

/* 키보드 사용자도 효과 체험 가능 */

flowerButton.addEventListener(
  "focus",
  ()=>{
    hovering=true;
    startAnimation();
  }
);

flowerButton.addEventListener(
  "blur",
  ()=>{
    hovering=false;
    startAnimation();
  }
);

/* 이미지 로딩 완료 */

image.onload=()=>{
  fallback.style.display="none";
  renderFlower();
};

image.onerror=()=>{
  console.warn("flower.png 파일 확인 필요");
};

/* ===================================
   기존 화면 전환
=================================== */

let transitioning=false;

function openDoor(){

  if(transitioning)return;
  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  entrance.classList.add("fading");

  setTimeout(()=>{

    entrance.classList.add("hidden");
    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        archive.classList.add("visible");
        transitioning=false;
      });
    });

  },motionReduced?20:1100);
}

function closeDoor(){

  if(transitioning)return;
  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  archive.classList.remove("visible");

  setTimeout(()=>{

    archive.classList.add("hidden");
    entrance.classList.remove("hidden");
    entrance.classList.remove("fading");

    /* 다시 처음부터 꽃이 복원된 상태 */

    hovering=false;
    progress=0;
    running=false;
    lastTime=0;
    renderFlower();

    transitioning=false;

  },motionReduced?20:1100);
}

</script>
</body>
</html>
