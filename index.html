
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留華 | 850년의 기록</title>

<style>
:root{
  --bg:#0d0c10;
  --gold:#b99a75;
  --ivory:#eee7dc;
  --muted:#c9beb2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  color:var(--ivory);
  font-family:"Gungsuh","궁서","Batang","바탕",serif;
}
button{font:inherit;cursor:pointer}
.screen{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  padding:30px;
  background:radial-gradient(
    ellipse at 50% 40%,#292329,#0d0c10 75%
  );
}
.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}
.content{
  position:relative;
  z-index:2;
  width:100%;
}
.eyebrow{
  font:10px Arial,sans-serif;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:28px;
}
.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(0 0 22px #d8bda426);
}
.subtitle{
  font-family:"Gungsuh","궁서","Batang","바탕",serif;
  font-size:14px;
  font-weight:400;
  letter-spacing:3px;
  color:#c4b29e;
  margin-top:20px;
}
.line{
  width:46px;
  height:1px;
  background:#a58b71;
  margin:35px auto;
}
.quote{
  font-size:14px;
  line-height:2.4;
  color:var(--muted);
  word-break:keep-all;
}

/* 시네마틱 버튼 */
.enter{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin-top:43px;
  padding:19px 32px;
  border:0;
  background:transparent;
  color:#e9d8c2;
  font-family:"Gungsuh","궁서","Batang",serif;
  font-size:15px;
  letter-spacing:4px;
  cursor:pointer;
  overflow:hidden;
  transition:color .5s,letter-spacing .5s;
}
.enter::before,
.enter::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,transparent,#b99a75,transparent
  );
  transition:left .6s,right .6s,box-shadow .6s;
}
.enter::before{top:0}
.enter::after{bottom:0}
.enter:hover{
  color:#fff6e7;
  letter-spacing:6px;
  text-shadow:0 0 16px #e6c69c80;
}
.enter:hover::before,
.enter:hover::after{
  left:0;
  right:0;
  box-shadow:0 0 12px #d6ad8066;
}
.enter .arrow{
  font-family:Arial,sans-serif;
  font-size:18px;
  font-weight:300;
  color:#bda181;
  transition:transform .5s;
}
.enter:hover .arrow{
  transform:translate(4px,-4px);
}
.enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:6px;
}
.hidden{display:none!important}

/* 기록 보관소 */
.archive-title{
  font-size:65px;
  font-weight:400;
  color:#e9ddc8;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:760px;
  margin:40px auto 0;
}
.card{
  border:1px solid #66594c;
  padding:35px 12px;
  background:#ffffff05;
  min-height:160px;
  transition:background .3s,border-color .3s;
}
.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
}
.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}
.card small{
  font:10px Arial,sans-serif;
  letter-spacing:2px;
  color:#bba992;
}
.card p{font-size:13px}
.note{
  font-size:11px;
  color:#8c8076;
  margin-top:35px;
}

/* 부드러운 화면 전환 */
#entrance,
#archive{
  transition:opacity 1.1s ease;
}
#archive{
  opacity:0;
}
#archive.visible{
  opacity:1;
}
#entrance.fading{
  opacity:0;
}

/* 모바일 */
@media(max-width:600px){
  .cards{
    grid-template-columns:1fr;
    max-width:290px;
  }
  .screen{padding:35px 25px}
  .title-image{
    height:clamp(210px,38vh,330px);
  }
  .quote{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  #entrance,#archive{transition-duration:.01s}
  .enter,.enter::before,.enter::after,.enter .arrow{
    transition-duration:.01s;
  }
}
</style>
</head>

<body>

<!-- 첫 화면 -->
<section class="screen" id="entrance">
  <div class="content">
    <div class="eyebrow">THE UNSEEN YEARS</div>

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華 붓글씨"
    >

    <div class="subtitle">850년의 기록</div>
    <div class="line"></div>

    <div class="quote">
      오래도록 이곳에 머물렀다.<br>
      수많은 계절이 지나갔고,<br>
      마침내 누군가 나를 보았다.
    </div>

    <button class="enter" onclick="openDoor()">
      문을 열다 <span class="arrow">↗</span>
    </button>
  </div>
</section>

<!-- 기록 보관소 -->
<section class="screen hidden" id="archive">
  <div class="content">
    <div class="eyebrow">THE ARCHIVE OF YUHWA</div>

    <div class="archive-title">留華</div>
    <div class="subtitle">이제야 보여줄 수 있는 것들</div>
    <div class="line"></div>

    <div class="cards">
      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>
    </div>

    <p class="note">기록은 아직 잠들어 있다.</p>

    <button class="enter" onclick="closeDoor()">
      돌아가기 <span class="arrow">↗</span>
    </button>
  </div>
</section>

<script>
let transitioning=false;

function openDoor(){
  if(transitioning)return;
  transitioning=true;

  const entrance=document.getElementById("entrance");
  const archive=document.getElementById("archive");

  entrance.classList.add("fading");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{
    entrance.classList.add("hidden");
    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        archive.classList.add("visible");
        transitioning=false;
      });
    });
  },reduced?20:1100);
}

function closeDoor(){
  if(transitioning)return;
  transitioning=true;

  const entrance=document.getElementById("entrance");
  const archive=document.getElementById("archive");

  archive.classList.remove("visible");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{
    archive.classList.add("hidden");
    entrance.classList.remove("hidden");
    entrance.classList.remove("fading");
    transitioning=false;
  },reduced?20:1100);
}
</script>

</body>
</html>
