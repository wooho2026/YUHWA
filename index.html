
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留華 | 850년의 기록</title>

<!-- 마루부리 무료 웹폰트 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>
:root{
  --bg:#0d0c10;
  --gold:#b99a75;
  --ivory:#eee7dc;
  --muted:#c9beb2;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--ivory);
  font-family:"Maru Buri","Malgun Gothic",serif;
}

button{
  font:inherit;
  cursor:pointer;
}

/* ==================================
   공통 화면
================================== */

.screen{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  padding:30px;
  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
}

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:28px;
}

/* 유화 붓글씨 */

.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(0 0 22px #d8bda426);
}

.subtitle{
  font-family:"Maru Buri",serif;
  font-size:15px;
  font-weight:400;
  letter-spacing:2px;
  color:#c4b29e;
  margin-top:20px;
}

.line{
  width:46px;
  height:1px;
  background:#a58b71;
  margin:30px auto;
}

.quote{
  font-family:"Maru Buri",serif;
  font-size:14px;
  font-weight:400;
  line-height:2.4;
  color:var(--muted);
  word-break:keep-all;
}

/* ==================================
   꽃 + 문을 열다 버튼
================================== */

.flower-enter{
  position:relative;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-top:29px;
  padding:8px 26px 16px;
  border:0;
  background:transparent;
  color:#eee1cf;
  font-family:"Maru Buri",serif;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.flower-stage{
  width:158px;
  height:158px;
  display:grid;
  place-items:center;
  position:relative;
  isolation:isolate;
}

/* 꽃 후광 */

.flower-stage::before{
  content:"";
  position:absolute;
  inset:-17px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(240,220,181,.15) 0%,
    rgba(226,196,152,.07) 37%,
    transparent 72%
  );
  animation:glowBreath 6s ease-in-out infinite;
  pointer-events:none;
}

/* 회전하는 꽃의 흐릿한 잔광 */

.flower-aura{
  position:absolute;
  width:142px;
  height:142px;
  object-fit:contain;
  opacity:.14;
  filter:blur(11px);
  animation:flowerSpin 20s linear infinite;
  pointer-events:none;
}

/* 실제 꽃 */

.flower-image{
  position:relative;
  width:142px;
  height:142px;
  object-fit:contain;
  animation:flowerSpin 20s linear infinite;
  filter:drop-shadow(
    0 0 8px rgba(245,228,195,.14)
  );
  transition:filter .7s ease;
  pointer-events:none;
}

@keyframes flowerSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

@keyframes glowBreath{
  0%,100%{
    opacity:.55;
    transform:scale(.95);
  }
  50%{
    opacity:1;
    transform:scale(1.1);
  }
}

.flower-enter:hover .flower-image{
  filter:drop-shadow(
    0 0 17px rgba(255,229,187,.52)
  );
}

.flower-enter:hover .flower-aura{
  opacity:.28;
}

/* ==================================
   V5 핵심 : 글자 잔상 효과
================================== */

/* 본문과 잔상을 겹쳐 놓는 컨테이너 */

.flower-label{
  position:relative;
  display:grid;
  place-items:center;
  margin-top:16px;
  white-space:nowrap;
  font-family:"Maru Buri",serif;
  font-size:20px;
  font-weight:400;
  letter-spacing:4px;
  line-height:1.7;
  color:#eee1cf;
  isolation:isolate;
}

/* 모든 글자를 동일 위치에 배치 */

.label-main,
.label-ghost-one,
.label-ghost-two{
  grid-area:1/1;
  display:block;
}

/* 기본 글자 */

.label-main{
  position:relative;
  z-index:3;
  opacity:1;
  filter:blur(0);
  transform:translate(0,0);
  will-change:filter,opacity,transform;
}

/* 첫 번째 잔상 */

.label-ghost-one{
  position:relative;
  z-index:2;
  color:#e9caa1;
  opacity:0;
  filter:blur(0);
  pointer-events:none;
  will-change:filter,opacity,transform;
}

/* 두 번째 잔상 */

.label-ghost-two{
  position:relative;
  z-index:1;
  color:#fff0d3;
  opacity:0;
  filter:blur(0);
  pointer-events:none;
  will-change:filter,opacity,transform;
}

/* 실제 호버할 때만 애니메이션 실행 */

.flower-enter:hover .label-main,
.flower-enter:focus-visible .label-main{
  animation:textReveal 1.4s ease-out both;
}

.flower-enter:hover .label-ghost-one,
.flower-enter:focus-visible .label-ghost-one{
  animation:ghostTrailOne 1.4s ease-out both;
}

.flower-enter:hover .label-ghost-two,
.flower-enter:focus-visible .label-ghost-two{
  animation:ghostTrailTwo 1.4s ease-out both;
}

/* 본문 :
   흐릿해졌다가 서서히 선명해짐 */

@keyframes textReveal{
  0%{
    opacity:1;
    filter:blur(0);
    transform:translate(0,0);
  }

  12%{
    opacity:.35;
    filter:blur(5px);
    transform:translate(-3px,1px);
  }

  36%{
    opacity:.55;
    filter:blur(3px);
    transform:translate(1px,0);
  }

  70%{
    opacity:.88;
    filter:blur(1px);
    transform:translate(0,0);
  }

  100%{
    opacity:1;
    filter:blur(0);
    transform:translate(0,0);
    text-shadow:
      0 0 11px rgba(245,215,172,.25);
  }
}

/* 첫 번째 잔상 :
   오른쪽으로 밀려나며 사라짐 */

@keyframes ghostTrailOne{
  0%{
    opacity:0;
    filter:blur(0);
    transform:translate(0,0);
  }

  14%{
    opacity:.7;
    filter:blur(2px);
    transform:translate(4px,-1px);
  }

  38%{
    opacity:.48;
    filter:blur(5px);
    transform:translate(10px,-2px);
  }

  70%{
    opacity:.18;
    filter:blur(8px);
    transform:translate(15px,-3px);
  }

  100%{
    opacity:0;
    filter:blur(12px);
    transform:translate(20px,-4px);
  }
}

/* 두 번째 잔상 :
   왼쪽으로 밀려나며 사라짐 */

@keyframes ghostTrailTwo{
  0%{
    opacity:0;
    filter:blur(0);
    transform:translate(0,0);
  }

  18%{
    opacity:.45;
    filter:blur(3px);
    transform:translate(-5px,2px);
  }

  45%{
    opacity:.3;
    filter:blur(6px);
    transform:translate(-10px,3px);
  }

  75%{
    opacity:.1;
    filter:blur(9px);
    transform:translate(-15px,4px);
  }

  100%{
    opacity:0;
    filter:blur(12px);
    transform:translate(-19px,5px);
  }
}

/* 클릭했을 때 꽃과 글자 빛 */

.flower-enter:active .flower-image{
  filter:drop-shadow(
    0 0 25px rgba(255,236,202,.8)
  );
}

.flower-enter:active .label-main{
  text-shadow:0 0 18px rgba(255,230,190,.8);
}

.flower-enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:7px;
}

/* ==================================
   돌아가기 버튼
================================== */

.enter{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin-top:43px;
  padding:19px 32px;
  border:0;
  background:transparent;
  color:#e9d8c2;
  font-family:"Maru Buri",serif;
  font-size:15px;
  letter-spacing:4px;
  overflow:hidden;
  transition:color .5s,letter-spacing .5s;
}

.enter::before,
.enter::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,transparent,#b99a75,transparent
  );
  transition:left .6s,right .6s,box-shadow .6s;
}

.enter::before{top:0}
.enter::after{bottom:0}

.enter:hover{
  color:#fff6e7;
  letter-spacing:6px;
  text-shadow:0 0 16px #e6c69c80;
}

.enter:hover::before,
.enter:hover::after{
  left:0;
  right:0;
  box-shadow:0 0 12px #d6ad8066;
}

.enter .arrow{
  font-family:Arial,sans-serif;
  font-size:18px;
  font-weight:300;
  color:#bda181;
  transition:transform .5s;
}

.enter:hover .arrow{
  transform:translate(4px,-4px);
}

.enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:6px;
}

/* ==================================
   기록 보관소
================================== */

.hidden{
  display:none!important;
}

.archive-title{
  font-size:65px;
  font-weight:400;
  color:#e9ddc8;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:760px;
  margin:40px auto 0;
}

.card{
  border:1px solid #66594c;
  padding:35px 12px;
  background:#ffffff05;
  min-height:160px;
  transition:background .3s,border-color .3s;
}

.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
}

.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}

.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#bba992;
}

.card p{
  font-size:13px;
}

.note{
  font-size:11px;
  color:#8c8076;
  margin-top:35px;
}

/* ==================================
   페이드 화면 전환
================================== */

#entrance,
#archive{
  transition:opacity 1.1s ease;
}

#archive{opacity:0}
#archive.visible{opacity:1}
#entrance.fading{opacity:0}

/* ==================================
   모바일
================================== */

@media(max-width:600px){

  .screen{
    padding:35px 25px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .quote{
    font-size:13px;
    line-height:2.3;
  }

  .subtitle{
    font-size:14px;
  }

  .flower-stage{
    width:132px;
    height:132px;
  }

  .flower-image,
  .flower-aura{
    width:122px;
    height:122px;
  }

  .flower-label{
    font-size:18px;
  }

  .cards{
    grid-template-columns:1fr;
    max-width:290px;
  }

}

/* 동작 최소화 사용자 설정 */

@media(prefers-reduced-motion:reduce){

  #entrance,
  #archive{
    transition-duration:.01s;
  }

  .flower-image,
  .flower-aura,
  .flower-stage::before,
  .label-main,
  .label-ghost-one,
  .label-ghost-two{
    animation:none!important;
  }

  .flower-image,
  .enter,
  .enter::before,
  .enter::after,
  .enter .arrow{
    transition-duration:.01s;
  }

  .label-ghost-one,
  .label-ghost-two{
    opacity:0!important;
  }

  .label-main{
    opacity:1!important;
    filter:none!important;
    transform:none!important;
  }
}

</style>
</head>

<body>

<!-- ==================================
     첫 화면
================================== -->

<section class="screen" id="entrance">

  <div class="content">

    <div class="eyebrow">
      THE UNSEEN YEARS
    </div>

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華 붓글씨"
    >

    <div class="subtitle">
      850년의 기록
    </div>

    <div class="line"></div>

    <div class="quote">
      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>
      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.
    </div>

    <!-- V5 회전 꽃 + 글자 잔상 -->

    <button
      class="flower-enter"
      type="button"
      onclick="openDoor()"
      aria-label="문을 열다"
    >

      <span class="flower-stage">

        <img
          class="flower-aura"
          src="flower.png"
          alt=""
          aria-hidden="true"
        >

        <img
          class="flower-image"
          src="flower.png"
          alt=""
        >

      </span>

      <span class="flower-label" aria-hidden="true">

        <span class="label-main">
          문을 열다
        </span>

        <span class="label-ghost-one">
          문을 열다
        </span>

        <span class="label-ghost-two">
          문을 열다
        </span>

      </span>

    </button>

  </div>

</section>

<!-- ==================================
     기록 보관소
================================== -->

<section class="screen hidden" id="archive">

  <div class="content">

    <div class="eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <div class="archive-title">
      留華
    </div>

    <div class="subtitle">
      이제야 보여줄 수 있는 것들
    </div>

    <div class="line"></div>

    <div class="cards">

      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="enter"
      type="button"
      onclick="closeDoor()"
    >
      돌아가기
      <span class="arrow">↗</span>
    </button>

  </div>

</section>

<!-- ==================================
     JavaScript 화면 전환
================================== -->

<script>

let transitioning=false;

function openDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  entrance.classList.add("fading");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{

    entrance.classList.add("hidden");
    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{

      requestAnimationFrame(()=>{

        archive.classList.add("visible");
        transitioning=false;

      });

    });

  },reduced?20:1100);

}

function closeDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  archive.classList.remove("visible");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{

    archive.classList.add("hidden");
    entrance.classList.remove("hidden");
    entrance.classList.remove("fading");

    transitioning=false;

  },reduced?20:1100);

}

</script>

</body>
</html>
