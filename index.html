
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>留華 | 850년의 기록</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>

/* ========================================
   留華 — V11
   기본 설정
======================================== */

:root{
  --bg:#0d0c10;
  --ivory:#eee7dc;
  --muted:#c9beb2;
  --gold:#b99a75;
  --paper:#e9dfce;
  --ink:#51473e;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--ivory);
  font-family:"Maru Buri","Malgun Gothic",serif;
}

button{
  font:inherit;
  cursor:pointer;
  color:inherit;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:5px;
}

img{
  -webkit-user-drag:none;
  user-select:none;
}

.hidden{
  display:none!important;
}

/* ========================================
   공통 화면
======================================== */

.screen{
  min-height:100vh;
  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  text-align:center;

  padding:40px 30px;

  overflow:hidden;

  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );

  transition:opacity 1.1s ease;
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.screen.fading{
  opacity:0;
}

.content{
  width:100%;
  position:relative;
  z-index:2;
}

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
}

/* ========================================
   첫 화면
======================================== */

.title-image{
  display:block;

  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);

  object-fit:contain;
  margin:0 auto;

  filter:drop-shadow(
    0 0 22px #d8bda426
  );
}

.quote{
  margin-top:28px;

  font-size:14px;
  font-weight:400;
  line-height:1.7;

  color:var(--muted);
  word-break:keep-all;
}

/* ========================================
   공통 꽃 버튼
   원본 꽃 유지 + 꽃잎 8장
======================================== */

.flower-enter{
  display:block;
  position:relative;

  width:150px;
  height:250px;

  margin:6px auto 0;
  padding:0;

  border:0;
  background:transparent;
}

.flower-stage{
  position:absolute;
  display:block;

  width:250px;
  height:250px;

  top:0;
  left:50%;

  transform:translateX(-50%);
  pointer-events:none;
}

.flower-main{
  position:absolute;
  z-index:2;

  width:150px;
  height:150px;

  top:5px;
  left:50%;

  transform:translateX(-50%);

  object-fit:contain;

  filter:drop-shadow(
    0 0 8px rgba(245,226,202,.13)
  );
}

.petals-layer{
  position:absolute;
  inset:0;
  z-index:3;

  pointer-events:none;
}

.falling-petal{
  position:absolute;
  left:50%;
  top:80px;

  width:19px;
  height:34px;

  opacity:0;
  transform-origin:50% 15%;

  pointer-events:none;
}

.falling-petal svg{
  display:block;
  width:100%;
  height:100%;

  overflow:visible;

  filter:drop-shadow(
    0 2px 3px rgba(238,220,196,.12)
  );
}

.flower-enter.is-playing .falling-petal{
  animation:
    petalFall var(--duration) ease-in-out
    var(--delay) both;
}

@keyframes petalFall{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      rotate(var(--start-rotate))
      scale(.85);
  }

  12%{
    opacity:1;
  }

  30%{
    opacity:.95;

    transform:
      translate(
        calc(var(--start-x) + var(--sway)),
        calc(var(--start-y) + 35px)
      )
      rotate(45deg)
      scale(1);
  }

  60%{
    opacity:.85;

    transform:
      translate(
        calc(var(--start-x) - var(--sway)),
        calc(var(--start-y) + 85px)
      )
      rotate(125deg)
      scale(.9);
  }

  85%{
    opacity:.5;
  }

  100%{
    opacity:0;

    transform:
      translate(
        calc(var(--start-x) + var(--drift)),
        calc(var(--start-y) + var(--fall))
      )
      rotate(var(--end-rotate))
      scale(.7);
  }
}

/* ========================================
   기록 보관소
======================================== */

.archive-title-image{
  display:block;

  width:150px;
  height:175px;

  object-fit:contain;

  margin:0 auto;

  filter:drop-shadow(
    0 0 14px #d8bda41e
  );
}

/* 영문 제목은 붓글씨 아래 */

.archive-eyebrow{
  margin-top:15px;
  margin-bottom:30px;
}

/* ========================================
   V11 메뉴
   테두리 및 박스 배경 제거
======================================== */

.cards{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:28px;

  max-width:760px;
  margin:25px auto 0;
}

.card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  position:relative;

  min-width:0;
  min-height:190px;

  padding:15px 8px;

  border:0;
  background:transparent;

  text-align:center;
}

/* 한자 붓글씨 이미지 */

.menu-symbol{
  display:block;

  width:112px;
  height:112px;

  object-fit:contain;

  margin:0 auto 14px;

  opacity:.85;

  transition:
    opacity .7s ease,
    filter .7s ease;
}

.card:hover .menu-symbol,
.card:focus-visible .menu-symbol{
  opacity:1;

  filter:drop-shadow(
    0 0 16px rgba(247,227,201,.38)
  );
}

.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;

  color:#bba992;

  transition:color .5s;
}

.card p{
  margin:12px 0 0;

  font-size:15px;
  color:#e7dad0;

  transition:
    color .5s,
    text-shadow .5s;
}

.card:hover p{
  color:#fff3e2;

  text-shadow:
    0 0 12px #e7d3b94d;
}

.card:hover small{
  color:#e1c7a5;
}

.note{
  font-size:11px;
  color:#8c8076;

  margin-top:25px;
}

/* ========================================
   사진첩 표지 화면
======================================== */

.album-cover-content{
  max-width:800px;
  margin:0 auto;
}

.album-heading{
  margin:15px 0 30px;

  font-weight:400;
  font-size:21px;
  letter-spacing:3px;
}

/* 보내준 책 표지를 그대로 사용 */

.book-cover-button{
  display:block;

  position:relative;

  width:min(340px,72vw);
  margin:0 auto;

  padding:0;
  border:0;
  background:transparent;

  transform:none;
  transition:none;
  animation:none;
}

.book-cover-image{
  display:block;

  width:100%;
  height:auto;

  object-fit:contain;

  transform:none!important;
  transition:none!important;
  animation:none!important;

  filter:drop-shadow(
    0 16px 25px #0007
  );
}

/* 호버해도 표지는 움직이지 않음 */

.book-cover-button:hover,
.book-cover-button:hover .book-cover-image{
  transform:none!important;
}

.cover-hint{
  font-size:12px;

  color:#a89989;
  letter-spacing:1px;

  margin-top:22px;
}

/* ========================================
   실제 사진첩 내부
======================================== */

.reader-content{
  max-width:1120px;
  margin:0 auto;
}

.reader-header{
  margin-bottom:26px;
}

/* 책 크기는 모든 사진에서 동일 */

.book{
  position:relative;

  width:min(960px,100%);
  aspect-ratio:1.65;

  margin:0 auto;

  perspective:1800px;

  padding:9px;

  background:#292521;

  border-radius:6px 10px 10px 6px;

  box-shadow:
    0 25px 65px #0008,
    0 4px 0 #82715c,
    0 7px 0 #55483b;
}

/* 펼쳐진 양쪽 페이지 */

.book-spread{
  display:grid;

  grid-template-columns:1fr 1fr;

  position:relative;

  width:100%;
  height:100%;
}

.page{
  position:relative;

  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  overflow:hidden;

  color:var(--ink);

  background:#e9dfce;

  cursor:pointer;
}

/* 왼쪽 종이 */

.page-left{
  background:linear-gradient(
    90deg,
    #e1d3bd 0%,
    #eee5d5 5%,
    #ede3d2 90%,
    #cabcaa 100%
  );

  border-radius:2px 0 0 2px;
}

/* 오른쪽 종이 */

.page-right{
  background:linear-gradient(
    90deg,
    #cabcaa 0%,
    #eee5d5 10%,
    #f1e8da 95%,
    #decfb9 100%
  );

  border-radius:0 4px 4px 0;
}

/* 종이 내부 장식선 */

.page::after{
  content:"";

  position:absolute;
  inset:5%;

  border:1px solid rgba(128,105,75,.13);

  pointer-events:none;
}

/* 책 중앙 제본 */

.book-spine{
  position:absolute;

  z-index:5;

  top:0;
  bottom:0;

  left:50%;

  width:24px;

  transform:translateX(-50%);

  background:linear-gradient(
    90deg,
    transparent,
    #59473730,
    #47372750,
    #59473720,
    transparent
  );

  pointer-events:none;
}

/* 사진 영역 고정 */

.photo-frame{
  position:absolute;

  top:8%;
  right:9%;
  bottom:12%;
  left:9%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

/* 사진은 원본 비율 유지 */

.album-photo{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
}

.photo-number{
  position:absolute;

  left:0;
  right:0;

  bottom:5%;

  font-family:Arial,sans-serif;
  font-size:9px;

  letter-spacing:3px;

  color:#8e7e69;
}

/* 유화의 한마디 */

.page-writing{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  height:100%;

  padding:12%;
}

.chapter-number{
  font-family:Arial,sans-serif;
  font-size:9px;

  letter-spacing:3px;

  color:#9a846b;
}

.page-decoration{
  font-size:25px;
  color:#aa9378;

  margin:20px 0;
}

.photo-quote{
  font-size:clamp(12px,1.7vw,19px);

  line-height:2.1;
  font-weight:400;

  word-break:keep-all;
  white-space:pre-line;

  color:#52463c;
}

.signature{
  font-size:21px;
  color:#84705b;

  margin-top:26px;
}

/* 사진 확대 버튼 */

.zoom-button{
  position:absolute;
  z-index:8;

  right:7%;
  bottom:5%;

  width:30px;
  height:30px;

  border:1px solid #9b876a60;
  border-radius:50%;

  color:#75634d;
  background:#eee3d5b0;

  padding:0;

  font-size:15px;
}

/* ========================================
   입체적인 책장 넘김
======================================== */

.flip-sheet{
  position:absolute;

  z-index:20;

  top:0;

  width:50%;
  height:100%;

  transform-style:preserve-3d;

  pointer-events:none;
}

.flip-sheet.forward{
  left:50%;
  transform-origin:left center;

  animation:
    turnForward .9s
    cubic-bezier(.35,.08,.25,1)
    forwards;
}

.flip-sheet.backward{
  left:0;
  transform-origin:right center;

  animation:
    turnBackward .9s
    cubic-bezier(.35,.08,.25,1)
    forwards;
}

.flip-face{
  position:absolute;

  inset:0;

  backface-visibility:hidden;

  overflow:hidden;

  box-shadow:
    8px 2px 20px #0002;
}

.flip-back{
  transform:rotateY(180deg);
}

@keyframes turnForward{

  0%{
    transform:rotateY(0deg);
  }

  100%{
    transform:rotateY(-180deg);
  }
}

@keyframes turnBackward{

  0%{
    transform:rotateY(0deg);
  }

  100%{
    transform:rotateY(180deg);
  }
}

.reader-footer{
  margin-top:24px;
}

.page-counter{
  font-family:Arial,sans-serif;
  font-size:11px;

  color:#c1ad96;
  letter-spacing:4px;
}

.reader-hint{
  font-size:11px;
  color:#8c8076;

  margin-top:13px;
}

/* 마지막 장 이후 전체 보기 */

.view-all-button{
  display:block;

  margin:24px auto 0;

  padding:10px 24px;

  border:0;
  border-bottom:1px solid #b99a7580;

  background:transparent;

  font-size:14px;
  letter-spacing:2px;

  color:#ead8bd;

  transition:
    color .5s,
    text-shadow .5s;
}

.view-all-button:hover{
  color:#fff4df;

  text-shadow:
    0 0 12px #dfb78580;
}

/* ========================================
   전체 사진 보기
======================================== */

.gallery-content{
  max-width:1000px;
  margin:0 auto;
}

.gallery{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:16px;

  margin:35px auto 0;
}

.gallery-item{
  position:relative;

  display:block;

  padding:0;

  background:#ffffff04;

  border:0;

  overflow:hidden;

  aspect-ratio:3/4;
}

.gallery-item img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    filter .5s,
    transform .7s;
}

.gallery-item:hover img{
  transform:scale(1.035);

  filter:brightness(1.08);
}

.gallery-index{
  position:absolute;

  bottom:10px;
  left:12px;

  font-family:Arial,sans-serif;
  font-size:10px;

  letter-spacing:2px;
  color:#fff;

  text-shadow:0 1px 7px #000;
}

/* ========================================
   사진 전체 화면 확대
======================================== */

.lightbox{
  position:fixed;

  z-index:1000;

  inset:0;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#08070bed;

  padding:35px 55px;
}

.lightbox-image{
  display:block;

  max-width:100%;
  max-height:85vh;

  object-fit:contain;

  box-shadow:0 10px 50px #0008;
}

.lightbox-close{
  position:absolute;

  top:20px;
  right:24px;

  width:38px;
  height:38px;

  border:0;
  background:transparent;

  font-size:28px;
  color:#eee1ce;
}

.lightbox-arrow{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  border:0;
  background:transparent;

  padding:10px;

  font-size:25px;
  color:#cbb49a;
}

.lightbox-prev{
  left:12px;
}

.lightbox-next{
  right:12px;
}

.lightbox-count{
  position:absolute;

  bottom:18px;
  left:0;
  right:0;

  text-align:center;

  font:10px Arial,sans-serif;

  letter-spacing:3px;
  color:#b7a28e;
}

/* ========================================
   모바일
======================================== */

@media(max-width:600px){

  .screen{
    padding:35px 22px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .quote{
    font-size:13px;
    line-height:1.6;
  }

  .archive-title-image{
    width:120px;
    height:150px;
  }

  .eyebrow{
    font-size:9px;
    letter-spacing:3px;
  }

  .cards{
    grid-template-columns:repeat(3,1fr);
    gap:7px;

    margin-top:18px;
  }

  .card{
    min-height:130px;
    padding:8px 2px;
  }

  .menu-symbol{
    width:74px;
    height:74px;

    max-width:100%;

    margin-bottom:10px;
  }

  .card small{
    font-size:7px;
    letter-spacing:.8px;
  }

  .card p{
    font-size:12px;
    margin-top:9px;
  }

  .flower-enter{
    width:130px;
    height:220px;
  }

  .flower-stage{
    transform:translateX(-50%) scale(.87);
    transform-origin:top center;
  }

  .book-cover-button{
    width:min(280px,72vw);
  }

  /* 모바일에서도 책 크기 고정 */

  .book{
    aspect-ratio:1.1;

    padding:5px;
  }

  .book-spine{
    width:13px;
  }

  .photo-frame{
    top:7%;
    bottom:13%;
    left:6%;
    right:6%;
  }

  .page-writing{
    padding:8%;
  }

  .photo-quote{
    font-size:12px;
    line-height:1.8;
  }

  .chapter-number{
    font-size:7px;
    letter-spacing:1px;
  }

  .page-decoration{
    font-size:15px;
    margin:12px 0;
  }

  .signature{
    font-size:15px;
    margin-top:16px;
  }

  .photo-number{
    font-size:7px;
    letter-spacing:1px;
  }

  .zoom-button{
    width:24px;
    height:24px;
    font-size:12px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .lightbox{
    padding:30px 35px;
  }

  .lightbox-arrow{
    font-size:20px;
    padding:3px;
  }

  .lightbox-prev{
    left:5px;
  }

  .lightbox-next{
    right:5px;
  }
}

/* ========================================
   움직임 최소화 설정
======================================== */

@media(prefers-reduced-motion:reduce){

  .falling-petal{
    animation:none!important;
    opacity:0!important;
  }

  .flip-sheet{
    animation:none!important;
  }

  .screen{
    transition-duration:.01s;
  }
}

</style>
</head>

<body>

<!-- ========================================
     첫 화면
======================================== -->

<section class="screen" id="entrance">

  <div class="content">

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華"
    >

    <div class="quote">

      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>

      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.

    </div>

    <button
      class="flower-enter"
      type="button"
      data-target="archive"
      aria-label="기록 보관소 열기"
    ></button>

  </div>

</section>


<!-- ========================================
     기록 보관소
======================================== -->

<section class="screen hidden" id="archive">

  <div class="content">

    <img
      class="archive-title-image"
      src="yuhwa-title.png"
      alt="留華"
    >

    <div class="eyebrow archive-eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <div class="cards">

      <!-- 壹 : 그의 모습 -->

      <button
        class="card"
        type="button"
        onclick="goTo('album-cover')"
      >

        <img
          class="menu-symbol"
          src="First.png"
          alt="壹"
        >

        <small>THE PORTRAITS</small>

        <p>그의 모습</p>

      </button>

      <!-- 貳 : 오래된 기억 -->

      <button
        class="card"
        type="button"
        onclick="goTo('memories')"
      >

        <img
          class="menu-symbol"
          src="Second.png"
          alt="貳"
        >

        <small>THE MEMORIES</small>

        <p>오래된 기억</p>

      </button>

      <!-- 參 : 그의 목소리 -->

      <button
        class="card"
        type="button"
        onclick="goTo('voice')"
      >

        <img
          class="menu-symbol"
          src="Third.png"
          alt="參"
        >

        <small>THE VOICE</small>

        <p>그의 목소리</p>

      </button>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="flower-enter"
      type="button"
      data-target="entrance"
      aria-label="첫 화면으로 돌아가기"
    ></button>

  </div>

</section>


<!-- ========================================
     사진첩 표지
======================================== -->

<section class="screen hidden" id="album-cover">

  <div class="content album-cover-content">

    <div class="eyebrow">
      THE PORTRAITS
    </div>

    <h1 class="album-heading">
      그의 모습
    </h1>

    <!-- 사용자가 제공한 원본 표지 -->

    <button
      class="book-cover-button"
      type="button"
      onclick="openAlbum()"
      aria-label="유화의 사진첩 열기"
    >

      <img
        class="book-cover-image"
        src="book%20cover.png"
        alt="유화의 사진첩"
      >

    </button>

    <p class="cover-hint">
      책을 눌러 펼쳐보세요.
    </p>

    <button
      class="flower-enter"
      type="button"
      data-target="archive"
      aria-label="기록 보관소로 돌아가기"
    ></button>

  </div>

</section>


<!-- ========================================
     사진첩 내부
======================================== -->

<section class="screen hidden" id="album-reader">

  <div class="content reader-content">

    <div class="reader-header">

      <div class="eyebrow">
        THE PORTRAITS OF YUHWA
      </div>

    </div>

    <div class="book" id="book">

      <div class="book-spread" id="bookSpread">

        <!-- 왼쪽 페이지 : 사진 -->

        <div
          class="page page-left"
          id="leftPage"
          role="button"
          tabindex="0"
          aria-label="이전 페이지"
        ></div>

        <!-- 오른쪽 페이지 : 유화의 한마디 -->

        <div
          class="page page-right"
          id="rightPage"
          role="button"
          tabindex="0"
          aria-label="다음 페이지"
        ></div>

        <div class="book-spine"></div>

      </div>

    </div>

    <div class="reader-footer">

      <div class="page-counter" id="pageCounter">
        01 / 05
      </div>

      <div class="reader-hint">
        책장을 눌러 넘겨보세요.
      </div>

      <button
        class="view-all-button hidden"
        id="viewAllButton"
        type="button"
        onclick="openGallery()"
      >
        모든 사진 펼쳐보기
      </button>

    </div>

    <button
      class="flower-enter"
      type="button"
      data-target="album-cover"
      aria-label="사진첩 덮기"
    ></button>

  </div>

</section>


<!-- ========================================
     전체 사진 펼쳐보기
======================================== -->

<section class="screen hidden" id="gallery-screen">

  <div class="content gallery-content">

    <div class="eyebrow">
      THE COMPLETE COLLECTION
    </div>

    <h1 class="album-heading">
      유화의 모든 모습
    </h1>

    <div class="gallery" id="galleryGrid"></div>

    <button
      class="flower-enter"
      type="button"
      data-target="album-reader"
      aria-label="사진첩으로 돌아가기"
    ></button>

  </div>

</section>


<!-- ========================================
     오래된 기억
     추후 콘텐츠 연결
======================================== -->

<section class="screen hidden" id="memories">

  <div class="content">

    <img
      class="menu-symbol"
      src="Second.png"
      alt="貳"
    >

    <div class="eyebrow">
      THE MEMORIES
    </div>

    <h1 class="album-heading">
      오래된 기억
    </h1>

    <p class="quote">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="flower-enter"
      type="button"
      data-target="archive"
      aria-label="기록 보관소로 돌아가기"
    ></button>

  </div>

</section>


<!-- ========================================
     그의 목소리
     추후 MP3 연결
======================================== -->

<section class="screen hidden" id="voice">

  <div class="content">

    <img
      class="menu-symbol"
      src="Third.png"
      alt="參"
    >

    <div class="eyebrow">
      THE VOICE
    </div>

    <h1 class="album-heading">
      그의 목소리
    </h1>

    <p class="quote">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="flower-enter"
      type="button"
      data-target="archive"
      aria-label="기록 보관소로 돌아가기"
    ></button>

  </div>

<!-- ========================================
     사진 확대
======================================== -->

<div
  class="lightbox hidden"
  id="lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="사진 확대 보기"
>

  <button
    class="lightbox-close"
    type="button"
    onclick="closeLightbox()"
    aria-label="닫기"
  >×</button>

  <button
    class="lightbox-arrow lightbox-prev"
    type="button"
    onclick="moveLightbox(-1)"
    aria-label="이전 사진"
  >‹</button>

  <img
    class="lightbox-image"
    id="lightboxImage"
    src=""
    alt="유화의 모습"
  >

  <button
    class="lightbox-arrow lightbox-next"
    type="button"
    onclick="moveLightbox(1)"
    aria-label="다음 사진"
  >›</button>

  <div
    class="lightbox-count"
    id="lightboxCount"
  ></div>

</div>


<script>

/* ========================================
   사진과 유화의 대사

   사진 추가 및 대사 변경은
   이 부분에서 하면 된다.
======================================== */

const photos=[

  {
    src:"portrait-01.jpg",
    quote:"그리 빤히 보지 마라.\n…내 얼굴이 그렇게 신기하더냐?"
  },

  {
    src:"portrait-02.jpg",
    quote:"조금만 더 이리 있자.\n오늘은 아무것도 하지 않아도 좋으니."
  },

  {
    src:"portrait-03.jpg",
    quote:"이제는 네가 나를 만질 수 있구나."
  },

  {
    src:"portrait-04.jpg",
    quote:"변하지 않은 것은 이곳뿐이라 여겼는데.\n이제는 네가 있구나."
  },

  {
    src:"portrait-05.jpg",
    quote:"그래, 실컷 보아라.\n네게만 보여주는 모습이니."
  }

];


/* ========================================
   공통 화면 전환
======================================== */

let currentScreen="entrance";
let transitioning=false;

const motionReduced=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

const fadeTime=motionReduced?10:1100;

function goTo(target){

  if(transitioning)return;

  if(target===currentScreen)return;

  const next=document.getElementById(target);
  const previous=document.getElementById(currentScreen);

  if(!next||!previous)return;

  transitioning=true;

  resetPetalAnimations();

  if(document.activeElement instanceof HTMLElement){
    document.activeElement.blur();
  }

  previous.classList.add("fading");

  setTimeout(()=>{

    previous.classList.add("hidden");
    previous.classList.remove("fading");

    next.classList.add("fading");
    next.classList.remove("hidden");

    currentScreen=target;

    window.scrollTo(0,0);

    requestAnimationFrame(()=>{

      requestAnimationFrame(()=>{

        next.classList.remove("fading");

        setTimeout(()=>{
          transitioning=false;
        },fadeTime);

      });

    });

  },fadeTime);

}


/* ========================================
   공통 꽃잎 데이터
======================================== */

const petalSettings=[

  [-63,0,-13,-39,136,0,2.8,-25,-205],

  [46,10,16,48,150,.21,3.1,38,260],

  [-37,27,18,-18,125,.43,2.9,-42,190],

  [65,-8,-17,28,148,.62,3.2,55,300],

  [12,36,12,-25,122,.83,2.7,15,-210],

  [-53,19,-12,-45,157,1.04,3.2,-35,-260],

  [34,29,18,39,137,1.25,3,30,240],

  [-8,43,-16,15,149,1.46,3.1,-15,210]

];

function createPetalSVG(index){

  const id="petal-gradient-"+index;

  return `
  <svg viewBox="0 0 36 66"
       xmlns="http://www.w3.org/2000/svg">

    <defs>

      <linearGradient
        id="${id}"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="100%"
      >

        <stop offset="0%"
          stop-color="#fffdf8"/>

        <stop offset="45%"
          stop-color="#f2ede3"/>

        <stop offset="100%"
          stop-color="#d6c8b6"/>

      </linearGradient>

    </defs>

    <path
      d="
        M18 3
        C31 17 36 37 23 56
        Q19 63 16 62
        C2 46 1 24 18 3
        Z
      "
      fill="url(#${id})"
    />

    <path
      d="M18 9 Q24 35 18 57"
      fill="none"
      stroke="#d1c4b3"
      stroke-width=".8"
      opacity=".38"
    />

    <path
      d="M16 15 Q9 36 16 52"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.4"
      opacity=".45"
    />

  </svg>
  `;

}


const flowerButtons=[
  ...document.querySelectorAll(".flower-enter")
];


/* 모든 화면에서 동일한 꽃 사용 */

flowerButtons.forEach((button,buttonIndex)=>{

  button.innerHTML=`
    <span class="flower-stage">

      <img
        class="flower-main"
        src="flower.png"
        alt=""
      >

      <span
        class="petals-layer"
        aria-hidden="true"
      ></span>

    </span>
  `;

  const layer=button.querySelector(".petals-layer");

  petalSettings.forEach((setting,index)=>{

    const [
      x,y,sway,drift,fall,
      delay,duration,rotate,end
    ]=setting;

    const petal=document.createElement("span");

    petal.className="falling-petal";

    petal.innerHTML=createPetalSVG(
      buttonIndex+"-"+index
    );

    const properties={

      "--start-x":x+"px",

      "--start-y":y+"px",

      "--sway":sway+"px",

      "--drift":drift+"px",

      "--fall":fall+"px",

      "--delay":delay+"s",

      "--duration":duration+"s",

      "--start-rotate":rotate+"deg",

      "--end-rotate":end+"deg"

    };

    Object.entries(properties).forEach(
      ([name,value])=>{
        petal.style.setProperty(name,value);
      }
    );

    layer.appendChild(petal);

  });

  button.addEventListener("pointerenter",event=>{

    if(event.pointerType==="mouse"){
      startPetalAnimation(button);
    }

  });

  button.addEventListener("pointerleave",()=>{

    button.classList.remove("is-playing");

  });

  button.addEventListener("focus",()=>{

    if(button.matches(":focus-visible")){
      startPetalAnimation(button);
    }

  });

  button.addEventListener("blur",()=>{

    button.classList.remove("is-playing");

  });

  button.addEventListener("click",()=>{

    goTo(button.dataset.target);

  });

});


function resetPetalAnimations(){

  flowerButtons.forEach(button=>{

    button.classList.remove("is-playing");

  });

}


function startPetalAnimation(button){

  if(transitioning||motionReduced)return;

  resetPetalAnimations();

  void button.offsetWidth;

  button.classList.add("is-playing");

}


/* ========================================
   사진첩 제어
======================================== */

let currentPage=0;
let pageTurning=false;
let albumCompleted=false;

const visitedPages=new Set();

const leftPage=document.getElementById("leftPage");
const rightPage=document.getElementById("rightPage");

const bookSpread=document.getElementById("bookSpread");

const pageCounter=document.getElementById("pageCounter");

const viewAllButton=document.getElementById(
  "viewAllButton"
);

function numberFormat(n){

  return String(n).padStart(2,"0");

}


/* 왼쪽 사진 페이지 */

function createLeftPage(index,withZoom=true){

  return `

    <div class="photo-frame">

      <img
        class="album-photo"
        src="${photos[index].src}"
        alt="유화의 모습 ${index+1}"
      >

    </div>

    <div class="photo-number">

      PORTRAIT ${numberFormat(index+1)}

    </div>

    ${withZoom?`
      <button
        class="zoom-button"
        type="button"
        aria-label="사진 확대"
        onclick="
          event.stopPropagation();
          showLightbox(${index},false);
        "
      >＋</button>
    `:""}

  `;

}


/* 오른쪽 대사 페이지 */

function createRightPage(index){

  return `

    <div class="page-writing">

      <div class="chapter-number">

        THE PORTRAITS · ${numberFormat(index+1)}

      </div>

      <div class="page-decoration">

        ❖

      </div>

      <div class="photo-quote"></div>

      <div class="signature">

        留華

      </div>

    </div>

  `;

}


function fillRightPage(element,index){

  element.innerHTML=createRightPage(index);

  element.querySelector(".photo-quote").textContent=
    photos[index].quote;

}


/* 사진첩 화면 갱신 */

function renderPage(){

  leftPage.innerHTML=createLeftPage(currentPage);

  fillRightPage(rightPage,currentPage);

  pageCounter.textContent=

    numberFormat(currentPage+1)+
    " / "+
    numberFormat(photos.length);

  visitedPages.add(currentPage);

  /* 모든 사진을 본 경우에만 해제 */

  if(
    currentPage===photos.length-1 &&
    visitedPages.size===photos.length
  ){

    albumCompleted=true;

  }

  viewAllButton.classList.toggle(
    "hidden",
    !albumCompleted
  );

  leftPage.setAttribute(
    "aria-disabled",
    String(currentPage===0)
  );

  rightPage.setAttribute(
    "aria-disabled",
    String(currentPage===photos.length-1)
  );

}


/* 책 표지 열기 */

function openAlbum(){

  if(transitioning||pageTurning)return;

  currentPage=0;

  renderPage();

  goTo("album-reader");

}


/* ========================================
   실제 책장 넘김
======================================== */

function turnPage(direction){

  if(pageTurning||transitioning)return;

  if(currentScreen!=="album-reader")return;

  const nextPage=currentPage+direction;

  if(nextPage<0||nextPage>=photos.length)return;

  if(motionReduced){

    currentPage=nextPage;

    renderPage();

    return;

  }

  pageTurning=true;

  const oldPage=currentPage;

  const sheet=document.createElement("div");

  sheet.className=

    "flip-sheet "+
    (direction===1?"forward":"backward");

  const front=document.createElement("div");

  const back=document.createElement("div");

  if(direction===1){

    /* 오른쪽 책장이 왼쪽으로 넘어감 */

    front.className=
      "flip-face page page-right";

    back.className=
      "flip-face flip-back page page-left";

    fillRightPage(front,oldPage);

    back.innerHTML=createLeftPage(
      nextPage,false
    );

    fillRightPage(rightPage,nextPage);

  }else{

    /* 왼쪽 책장이 오른쪽으로 넘어감 */

    front.className=
      "flip-face page page-left";

    back.className=
      "flip-face flip-back page page-right";

    front.innerHTML=createLeftPage(
      oldPage,false
    );

    fillRightPage(back,nextPage);

    leftPage.innerHTML=createLeftPage(
      nextPage,false
    );

  }

  sheet.appendChild(front);
  sheet.appendChild(back);

  sheet.setAttribute("aria-hidden","true");

  bookSpread.appendChild(sheet);

  let finished=false;

  function finishTurn(){

    if(finished)return;

    finished=true;

    currentPage=nextPage;

    sheet.remove();

    renderPage();

    pageTurning=false;

  }

  sheet.addEventListener(
    "animationend",
    finishTurn,
    {once:true}
  );

  setTimeout(finishTurn,1000);

}


/* 왼쪽 페이지 클릭 : 이전 장 */

leftPage.addEventListener("click",()=>{

  turnPage(-1);

});


/* 오른쪽 페이지 클릭 : 다음 장 */

rightPage.addEventListener("click",()=>{

  turnPage(1);

});


/* 키보드 접근 */

leftPage.addEventListener("keydown",event=>{

  if(event.target!==leftPage)return;

  if(event.key==="Enter"||event.key===" "){

    event.preventDefault();

    turnPage(-1);

  }

});


rightPage.addEventListener("keydown",event=>{

  if(event.key==="Enter"||event.key===" "){

    event.preventDefault();

    turnPage(1);

  }

});


/* ========================================
   모바일 스와이프
======================================== */

let touchStartX=0;
let touchStartY=0;

const book=document.getElementById("book");

book.addEventListener("touchstart",event=>{

  touchStartX=event.changedTouches[0].clientX;

  touchStartY=event.changedTouches[0].clientY;

},{passive:true});

book.addEventListener("touchend",event=>{

  const dx=

    event.changedTouches[0].clientX-
    touchStartX;

  const dy=

    event.changedTouches[0].clientY-
    touchStartY;

  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){

    turnPage(dx<0?1:-1);

  }

},{passive:true});


/* ========================================
   전체 사진 보기
======================================== */

const galleryGrid=document.getElementById(
  "galleryGrid"
);

function openGallery(){

  if(!albumCompleted)return;

  galleryGrid.innerHTML="";

  photos.forEach((photo,index)=>{

    const item=document.createElement("button");

    item.type="button";
    item.className="gallery-item";

    item.setAttribute(
      "aria-label",
      "사진 "+(index+1)+" 확대"
    );

    item.innerHTML=`

      <img
        src="${photo.src}"
        alt="유화의 모습 ${index+1}"
        loading="lazy"
      >

      <span class="gallery-index">

        ${numberFormat(index+1)}

      </span>

    `;

    item.addEventListener("click",()=>{

      showLightbox(index,true);

    });

    galleryGrid.appendChild(item);

  });

  goTo("gallery-screen");

}


/* ========================================
   사진 확대 보기
======================================== */

let lightboxIndex=0;
let lightboxBrowseAll=false;
let lightboxPreviousFocus=null;

const lightbox=document.getElementById("lightbox");

const lightboxImage=document.getElementById(
  "lightboxImage"
);

const lightboxCount=document.getElementById(
  "lightboxCount"
);

function showLightbox(index,allowAll){

  if(pageTurning)return;

  lightboxIndex=index;

  lightboxBrowseAll=allowAll||albumCompleted;

  lightboxPreviousFocus=document.activeElement;

  lightbox.classList.remove("hidden");

  document.body.style.overflow="hidden";

  updateLightbox();

  document.querySelector(".lightbox-close").focus();

}

function updateLightbox(){

  lightboxImage.src=photos[lightboxIndex].src;

  lightboxCount.textContent=

    numberFormat(lightboxIndex+1)+
    " / "+
    numberFormat(photos.length);

  document.querySelectorAll(
    ".lightbox-arrow"
  ).forEach(button=>{

    button.classList.toggle(
      "hidden",
      !lightboxBrowseAll
    );

  });

}

function moveLightbox(direction){

  if(!lightboxBrowseAll)return;

  lightboxIndex=

    (
      lightboxIndex+
      direction+
      photos.length
    )%photos.length;

  updateLightbox();

}

function closeLightbox(){

  lightbox.classList.add("hidden");

  document.body.style.overflow="";

  if(lightboxPreviousFocus instanceof HTMLElement){

    lightboxPreviousFocus.focus();

  }

}


/* 확대 화면 바깥 클릭 시 닫기 */

lightbox.addEventListener("click",event=>{

  if(event.target===lightbox){

    closeLightbox();

  }

});


/* ========================================
   방향키 지원
======================================== */

document.addEventListener("keydown",event=>{

  if(!lightbox.classList.contains("hidden")){

    if(event.key==="Escape"){

      closeLightbox();

    }

    if(event.key==="ArrowLeft"){

      event.preventDefault();

      moveLightbox(-1);

    }

    if(event.key==="ArrowRight"){

      event.preventDefault();

      moveLightbox(1);

    }

    return;

  }

  if(currentScreen==="album-reader"){

    if(event.key==="ArrowLeft"){

      event.preventDefault();

      turnPage(-1);

    }

    if(event.key==="ArrowRight"){

      event.preventDefault();

      turnPage(1);

    }

  }

});


/* 시작 상태 */

renderPage();

</script>
