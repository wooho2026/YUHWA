
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>留華 | 유화</title>

<!-- 마루부리 무료 웹폰트 -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>
:root{
  --bg:#0d0c10;
  --ivory:#eee7dc;
  --muted:#c9beb2;
  --gold:#b99a75;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:"Maru Buri","Malgun Gothic",serif;
  color:var(--ivory);
}

button{
  font:inherit;
  cursor:pointer;
}

/* ==================================
   공통 화면
================================== */

.screen{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  padding:40px 30px;
  text-align:center;

  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
}

.hidden{
  display:none!important;
}

/* ==================================
   인트로 — 유화 붓글씨
================================== */

.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;

  filter:drop-shadow(
    0 0 22px #d8bda426
  );
}

/* 인트로 문구 */

.quote{
  margin-top:28px;
  font-size:14px;
  font-weight:400;
  line-height:1.7;
  color:var(--muted);
  word-break:keep-all;
}

/* ==================================
   V9 공통 꽃 버튼
================================== */

.flower-enter{
  display:grid;
  place-items:center;
  position:relative;

  width:250px;
  height:250px;
  margin:6px auto 0;
  padding:0;

  border:0;
  background:transparent;
  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.flower-stage{
  display:block;
  position:relative;
  width:250px;
  height:250px;
  pointer-events:none;
}

/* 원본 꽃은 항상 온전하게 유지 */

.flower-main{
  position:absolute;
  z-index:2;

  display:block;
  width:150px;
  height:150px;

  top:5px;
  left:50%;
  transform:translateX(-50%);

  object-fit:contain;

  filter:drop-shadow(
    0 0 8px rgba(245,226,202,.13)
  );
}

/* 별도 꽃잎 레이어 */

.petals-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

/* 떨어지는 꽃잎 */

.falling-petal{
  position:absolute;

  left:50%;
  top:80px;

  width:19px;
  height:34px;

  opacity:0;
  transform-origin:50% 15%;
  pointer-events:none;
}

/* SVG 꽃잎 */

.falling-petal svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;

  filter:drop-shadow(
    0 2px 3px rgba(238,220,196,.12)
  );
}

/* 마우스 호버 또는 키보드 포커스 */

.flower-enter:hover .falling-petal,
.flower-enter:focus-visible .falling-petal{
  animation:
    petalFall var(--duration) ease-in-out
    var(--delay) both;
}

/* 꽃잎 낙하 */

@keyframes petalFall{

  0%{
    opacity:0;
    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      rotate(var(--start-rotate))
      scale(.85);
  }

  12%{
    opacity:1;
  }

  30%{
    opacity:.95;
    transform:
      translate(
        calc(var(--start-x) + var(--sway)),
        calc(var(--start-y) + 35px)
      )
      rotate(45deg)
      scale(1);
  }

  60%{
    opacity:.85;
    transform:
      translate(
        calc(var(--start-x) - var(--sway)),
        calc(var(--start-y) + 85px)
      )
      rotate(125deg)
      scale(.9);
  }

  85%{
    opacity:.5;
  }

  100%{
    opacity:0;
    transform:
      translate(
        calc(var(--start-x) + var(--drift)),
        calc(var(--start-y) + var(--fall))
      )
      rotate(var(--end-rotate))
      scale(.7);
  }
}

/* 키보드 접근성 */

.flower-enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:4px;
}

/* ==================================
   기록 보관소
================================== */

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:28px;
}

/* V9 : 한자 대신 큰 궁서체 유화 */

.archive-title{
  font-family:"Gungsuh","궁서","궁서체",serif;
  font-size:70px;
  font-weight:400;
  letter-spacing:5px;
  line-height:1.35;
  color:#e9ddc8;
}

/* ==================================
   카드 3개
================================== */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;

  max-width:760px;
  margin:40px auto 0;
}

.card{
  border:1px solid #66594c;
  border-radius:14px;

  padding:35px 12px;
  min-height:160px;

  background:#ffffff05;

  transition:
    background .3s,
    border-color .3s,
    box-shadow .3s;
}

.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
  box-shadow:
    0 0 22px rgba(185,154,117,.07);
}

.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}

.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#bba992;
}

.card p{
  font-size:13px;
}

.note{
  font-size:11px;
  color:#8c8076;
  margin-top:35px;
}

/* 기록 보관소 하단 꽃 */

.archive-flower{
  margin-top:12px;
}

/* ==================================
   페이드 화면 전환
================================== */

#entrance,
#archive{
  transition:opacity 1.1s ease;
}

#archive{
  opacity:0;
}

#archive.visible{
  opacity:1;
}

#entrance.fading{
  opacity:0;
}

/* ==================================
   모바일 반응형
================================== */

@media(max-width:600px){

  .screen{
    padding:35px 25px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .quote{
    font-size:13px;
    line-height:1.6;
  }

  .archive-title{
    font-size:56px;
  }

  .cards{
    grid-template-columns:1fr;
    max-width:290px;
    margin-top:30px;
  }

  .card{
    min-height:135px;
    padding:25px 12px;
  }

  .card span{
    margin-bottom:13px;
  }

  .flower-enter{
    width:220px;
    height:220px;
    margin-top:5px;
  }

  .flower-stage{
    transform:scale(.87);
    transform-origin:top center;
  }

  .archive-flower{
    margin-top:10px;
  }

}

/* 동작 최소화 설정 */

@media(prefers-reduced-motion:reduce){

  .falling-petal{
    animation:none!important;
    opacity:0!important;
  }

  #entrance,
  #archive{
    transition-duration:.01s;
  }

}

</style>
</head>

<body>

<!-- ==================================
     첫 화면
================================== -->

<section class="screen" id="entrance">

  <div class="content">

    <!-- 기존 붓글씨 이미지 -->
    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華"
    >

    <!-- 요청한 본문 유지 -->
    <div class="quote">
      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>
      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.
    </div>

    <!-- 꽃 클릭 : 기록 보관소 입장 -->
    <button
      class="flower-enter"
      type="button"
      onclick="openDoor()"
      aria-label="기록 보관소 열기"
    >

      <span class="flower-stage">

        <img
          class="flower-main"
          src="flower.png"
          alt=""
        >

        <span
          class="petals-layer"
          aria-hidden="true"
        ></span>

      </span>

    </button>

  </div>

</section>


<!-- ==================================
     기록 보관소
================================== -->

<section class="screen hidden" id="archive">

  <div class="content">

    <div class="eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <!-- 한자 대신 큰 궁서체 한글 -->
    <div class="archive-title">
      유화
    </div>

    <!-- 기존 카드 3개 -->

    <div class="cards">

      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <!-- 꽃 클릭 : 인트로로 돌아가기 -->
    <button
      class="flower-enter archive-flower"
      type="button"
      onclick="closeDoor()"
      aria-label="첫 화면으로 돌아가기"
    >

      <span class="flower-stage">

        <img
          class="flower-main"
          src="flower.png"
          alt=""
        >

        <span
          class="petals-layer"
          aria-hidden="true"
        ></span>

      </span>

    </button>

  </div>

</section>


<!-- ==================================
     JavaScript
================================== -->

<script>

/* ==================================
   꽃잎 8장 설정
================================== */

const petalSettings=[

  {
    x:-63,y:0,
    sway:-13,drift:-39,
    fall:136,delay:0,
    duration:2.8,
    rotate:-25,end:-205
  },

  {
    x:46,y:10,
    sway:16,drift:48,
    fall:150,delay:.21,
    duration:3.1,
    rotate:38,end:260
  },

  {
    x:-37,y:27,
    sway:18,drift:-18,
    fall:125,delay:.43,
    duration:2.9,
    rotate:-42,end:190
  },

  {
    x:65,y:-8,
    sway:-17,drift:28,
    fall:148,delay:.62,
    duration:3.2,
    rotate:55,end:300
  },

  {
    x:12,y:36,
    sway:12,drift:-25,
    fall:122,delay:.83,
    duration:2.7,
    rotate:15,end:-210
  },

  {
    x:-53,y:19,
    sway:-12,drift:-45,
    fall:157,delay:1.04,
    duration:3.2,
    rotate:-35,end:-260
  },

  {
    x:34,y:29,
    sway:18,drift:39,
    fall:137,delay:1.25,
    duration:3.0,
    rotate:30,end:240
  },

  {
    x:-8,y:43,
    sway:-16,drift:15,
    fall:149,delay:1.46,
    duration:3.1,
    rotate:-15,end:210
  }

];


/* ==================================
   꽃잎 SVG
================================== */

const petalSVG=`
<svg
  viewBox="0 0 36 66"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="petalGradient"
      x1="0" y1="0"
      x2="1" y2="1"
    >
      <stop
        offset="0%"
        stop-color="#fffdf8"
      />
      <stop
        offset="45%"
        stop-color="#f2ede3"
      />
      <stop
        offset="100%"
        stop-color="#d6c8b6"
      />
    </linearGradient>
  </defs>

  <path
    d="
      M18 3
      C31 17 36 37 23 56
      Q19 63 16 62
      C2 46 1 24 18 3
      Z
    "
    fill="url(#petalGradient)"
  />

  <path
    d="M18 9 Q24 35 18 57"
    fill="none"
    stroke="#d1c4b3"
    stroke-width=".8"
    opacity=".38"
  />

  <path
    d="M16 15 Q9 36 16 52"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.4"
    opacity=".45"
  />
</svg>
`;


/* ==================================
   양쪽 화면에 동일한 꽃잎 생성
================================== */

document.querySelectorAll(
  ".petals-layer"
).forEach((layer)=>{

  petalSettings.forEach((p)=>{

    const petal=document.createElement("span");

    petal.className="falling-petal";
    petal.innerHTML=petalSVG;

    petal.style.setProperty(
      "--start-x",p.x+"px"
    );

    petal.style.setProperty(
      "--start-y",p.y+"px"
    );

    petal.style.setProperty(
      "--sway",p.sway+"px"
    );

    petal.style.setProperty(
      "--drift",p.drift+"px"
    );

    petal.style.setProperty(
      "--fall",p.fall+"px"
    );

    petal.style.setProperty(
      "--delay",p.delay+"s"
    );

    petal.style.setProperty(
      "--duration",p.duration+"s"
    );

    petal.style.setProperty(
      "--start-rotate",p.rotate+"deg"
    );

    petal.style.setProperty(
      "--end-rotate",p.end+"deg"
    );

    layer.appendChild(petal);

  });

});


/* ==================================
   기존 화면 전환 기능
================================== */

let transitioning=false;

const motionReduced=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;


/* 꽃 클릭 -> 기록 보관소 */

function openDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  entrance.classList.add("fading");

  setTimeout(()=>{

    entrance.classList.add("hidden");

    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{

      requestAnimationFrame(()=>{

        archive.classList.add("visible");

        transitioning=false;

      });

    });

  },motionReduced?20:1100);

}


/* 꽃 클릭 -> 첫 화면 복귀 */

function closeDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  archive.classList.remove("visible");

  setTimeout(()=>{

    archive.classList.add("hidden");

    entrance.classList.remove("hidden");

    entrance.classList.remove("fading");

    transitioning=false;

  },motionReduced?20:1100);

}

</script>

</body>
</html>
