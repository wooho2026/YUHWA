
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>留華</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>

/* ========================================
   留華 V14
   기본 설정
======================================== */

:root{
  --bg:#0d0c10;
  --ivory:#eee7dc;
  --muted:#c9beb2;
  --gold:#b99a75;
  --paper:#e9dfce;
  --ink:#51473e;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--ivory);
  font-family:"Maru Buri","Malgun Gothic",serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
[role="button"]:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:5px;
}

img{
  -webkit-user-drag:none;
  user-select:none;
}

.hidden{
  display:none!important;
}

/* ========================================
   공통 화면
======================================== */

.screen{
  min-height:100vh;
  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  text-align:center;

  padding:40px 30px;
  overflow:hidden;

  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );

  transition:opacity 1.1s ease;
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.screen.fading{
  opacity:0;
  pointer-events:none;
}

.content{
  width:100%;
  position:relative;
  z-index:2;
}

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
}

/* ========================================
   첫 화면
======================================== */

.title-image{
  display:block;

  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);

  object-fit:contain;
  margin:0 auto;

  filter:drop-shadow(
    0 0 22px #d8bda426
  );
}

.quote{
  margin-top:28px;

  font-size:14px;
  font-weight:400;
  line-height:1.7;

  color:var(--muted);
  word-break:keep-all;
}

/* ========================================
   흰 꽃 및 꽃잎 8장
======================================== */

.flower-enter{
  display:block;
  position:relative;

  width:150px;
  height:250px;

  margin:6px auto 0;
  padding:0;

  border:0;
  background:transparent;
}

.flower-stage{
  position:absolute;
  display:block;

  width:250px;
  height:250px;

  top:0;
  left:50%;

  transform:translateX(-50%);

  pointer-events:none;
}

.flower-main{
  position:absolute;
  display:block;

  z-index:2;

  width:150px;
  height:150px;

  top:5px;
  left:50%;

  transform:translateX(-50%);
  object-fit:contain;

  filter:drop-shadow(
    0 0 8px rgba(245,226,202,.13)
  );
}

.petals-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.falling-petal{
  position:absolute;

  left:50%;
  top:80px;

  width:19px;
  height:34px;

  opacity:0;

  transform-origin:50% 15%;

  pointer-events:none;
  will-change:transform,opacity;
}

.falling-petal svg{
  display:block;
  width:100%;
  height:100%;

  overflow:visible;

  filter:drop-shadow(
    0 2px 3px rgba(238,220,196,.12)
  );
}

.flower-enter.is-playing .falling-petal{
  animation:
    petalFall var(--duration) ease-in-out
    var(--delay) both;
}

@keyframes petalFall{

  0%{
    opacity:0;
    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      rotate(var(--start-rotate))
      scale(.85);
  }

  12%{
    opacity:1;
  }

  30%{
    opacity:.95;
    transform:
      translate(
        calc(var(--start-x) + var(--sway)),
        calc(var(--start-y) + 35px)
      )
      rotate(45deg)
      scale(1);
  }

  60%{
    opacity:.85;
    transform:
      translate(
        calc(var(--start-x) - var(--sway)),
        calc(var(--start-y) + 85px)
      )
      rotate(125deg)
      scale(.9);
  }

  85%{
    opacity:.5;
  }

  100%{
    opacity:0;
    transform:
      translate(
        calc(var(--start-x) + var(--drift)),
        calc(var(--start-y) + var(--fall))
      )
      rotate(var(--end-rotate))
      scale(.7);
  }

}

/* ========================================
   V14 기록 보관소
   기존 일렬 배치 / 간격 60%
======================================== */

.archive-content{
  max-width:850px;
  margin:0 auto;
}

.archive-title-image{
  display:block;

  width:150px;
  height:175px;

  object-fit:contain;
  margin:0 auto;

  filter:drop-shadow(
    0 0 14px #d8bda41e
  );
}

.archive-eyebrow{
  margin-top:15px;
  margin-bottom:30px;

  font-size:10px;
  letter-spacing:5px;
  line-height:1.6;
}

/* 기존 760px의 60% */

.cards{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:16.8px;

  width:100%;
  max-width:456px;

  margin:25px auto 0;
}

.card{
  display:flex;

  flex-direction:column;
  align-items:center;
  justify-content:center;

  position:relative;

  min-width:0;
  min-height:190px;

  padding:15px 0;

  border:0;
  background:transparent;

  text-align:center;
}

.menu-symbol{
  display:block;

  width:112px;
  height:112px;

  max-width:100%;

  object-fit:contain;

  margin:0 auto 14px;

  opacity:.88;

  transition:
    opacity .7s ease,
    filter .7s ease;
}

.card:hover .menu-symbol,
.card:focus-visible .menu-symbol{
  opacity:1;

  filter:drop-shadow(
    0 0 17px rgba(247,227,201,.45)
  );
}

.card small{
  font-family:Arial,sans-serif;

  font-size:10px;
  letter-spacing:2px;

  color:#bba992;

  white-space:nowrap;

  transition:color .5s ease;
}

.card p{
  margin:12px 0 0;

  font-size:15px;
  color:#e7dad0;

  transition:
    color .5s ease,
    text-shadow .5s ease;
}

.card:hover small{
  color:#e1c7a5;
}

.card:hover p{
  color:#fff3e2;

  text-shadow:
    0 0 12px #e7d3b94d;
}

#archive .flower-enter{
  margin:25px auto 0;
}

/* ========================================
   사진첩 표지
======================================== */

.album-cover-content{
  max-width:800px;
  margin:0 auto;
}

.cover-eyebrow{
  margin-bottom:30px;
}

.album-heading{
  margin:15px 0 30px;

  font-weight:400;
  font-size:21px;
  letter-spacing:3px;
}

/* 책 자체는 고정 */

.book-cover-button{
  display:block;
  position:relative;

  width:min(340px,72vw);
  aspect-ratio:2/3;

  margin:0 auto;
  padding:0;

  border:0;
  background:transparent;

  perspective:1300px;
  isolation:isolate;
}

/* 표지 뒤에 보이는 종이 단면 */

.cover-paper-edges{
  position:absolute;

  inset:5px 4px 5px 11px;

  border-radius:4px 9px 9px 4px;

  background:repeating-linear-gradient(
    0deg,
    #d5c7ae 0px,
    #e6dac6 2px,
    #bba98e 3px,
    #eadfcb 4px
  );

  box-shadow:0 12px 25px #0006;
}

.cover-inner-paper{
  position:absolute;

  inset:9px 9px 9px 16px;

  border-radius:2px 5px 5px 2px;

  background:linear-gradient(
    90deg,
    #b4a289,
    #e7dcc8 9%,
    #f0e6d5 85%,
    #decfb6 100%
  );

  border:1px solid #bba88c;

  overflow:hidden;
  pointer-events:none;
}

.cover-inner-paper::after{
  content:"";
  position:absolute;
  inset:15px;
  border:1px solid #aa967c38;
}

/* 움직이는 표지 */

.cover-leaf{
  position:absolute;
  inset:0;

  z-index:3;

  transform-origin:left center;
  transform-style:preserve-3d;

  transform:rotateY(0deg);

  transition:
    transform .7s cubic-bezier(.22,.7,.25,1);
}

.book-cover-image{
  position:absolute;
  inset:0;

  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  backface-visibility:hidden;

  filter:drop-shadow(
    0 12px 18px #0006
  );
}

.cover-leaf-back{
  position:absolute;
  inset:5px;

  border-radius:4px;

  backface-visibility:hidden;
  transform:rotateY(180deg);

  background:linear-gradient(
    90deg,
    #bcaa8e,
    #e4d8c2 12%,
    #eee3d0 90%,
    #bfad92
  );

  box-shadow:
    inset 0 0 25px #77634b30;
}

/* 표지에 마우스를 올리면 살짝 열림 */

@media(hover:hover) and (pointer:fine){

  .book-cover-button:not(.opening):hover
  .cover-leaf{
    transform:rotateY(-23deg);
  }

}

.book-cover-button:not(.opening):focus-visible
.cover-leaf{
  transform:rotateY(-23deg);
}

/* 책을 클릭하면 펼쳐짐 */

.book-cover-button.opening
.cover-leaf{
  transform:rotateY(-155deg);

  transition:
    transform 1s cubic-bezier(.35,.08,.25,1);
}

.cover-hint{
  margin-top:22px;

  font-size:12px;
  color:#a89989;
  letter-spacing:1px;
}

/* ========================================
   사진첩 내부
======================================== */

.reader-content{
  max-width:1120px;
  margin:0 auto;
}

.reader-header{
  margin-bottom:26px;
}

/* 모든 사진에서 책 크기 고정 */

.book{
  position:relative;

  width:min(960px,100%);
  aspect-ratio:1.65;

  margin:0 auto;
  padding:9px;

  perspective:1800px;

  background:#292521;

  border-radius:6px 10px 10px 6px;

  box-shadow:
    0 25px 65px #0008,
    0 4px 0 #82715c,
    0 7px 0 #55483b;

  touch-action:pan-y;
}

.book-spread{
  display:grid;

  grid-template-columns:1fr 1fr;

  position:relative;

  width:100%;
  height:100%;
}

.page{
  position:relative;

  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  overflow:hidden;

  color:var(--ink);
  background:var(--paper);

  cursor:pointer;
}

.page-left{
  background:linear-gradient(
    90deg,
    #e1d3bd 0%,
    #eee5d5 5%,
    #ede3d2 90%,
    #cabcaa 100%
  );

  border-radius:2px 0 0 2px;
}

.page-right{
  background:linear-gradient(
    90deg,
    #cabcaa 0%,
    #eee5d5 10%,
    #f1e8da 95%,
    #decfb9 100%
  );

  border-radius:0 4px 4px 0;
}

.page::after{
  content:"";

  position:absolute;
  inset:5%;

  border:1px solid rgba(128,105,75,.13);

  pointer-events:none;
}

.book-spine{
  position:absolute;
  z-index:5;

  top:0;
  bottom:0;
  left:50%;

  width:24px;

  transform:translateX(-50%);

  background:linear-gradient(
    90deg,
    transparent,
    #59473730,
    #47372750,
    #59473720,
    transparent
  );

  pointer-events:none;
}

/* ========================================
   사진 영역
======================================== */

.photo-frame{
  position:absolute;

  top:8%;
  right:9%;
  bottom:12%;
  left:9%;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.album-photo{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
}

.photo-number{
  position:absolute;

  left:0;
  right:0;
  bottom:5%;

  font-family:Arial,sans-serif;

  font-size:9px;
  letter-spacing:3px;

  color:#8e7e69;
}

/* ========================================
   유화의 대사
======================================== */

.page-writing{
  display:flex;

  flex-direction:column;
  align-items:center;
  justify-content:center;

  height:100%;

  padding:9%;
}

.chapter-number{
  font-family:Arial,sans-serif;

  font-size:9px;
  letter-spacing:3px;

  color:#9a846b;
}

.page-decoration{
  font-size:25px;
  color:#aa9378;

  margin:20px 0;
}

.photo-quote{
  width:100%;

  font-size:clamp(12px,1.7vw,19px);
  font-weight:400;

  line-height:1.5;

  word-break:keep-all;
  overflow-wrap:break-word;

  white-space:pre-line;
  text-wrap:pretty;

  color:#52463c;
}

/* 사진 확대 */

.zoom-button{
  position:absolute;

  z-index:8;

  right:7%;
  bottom:5%;

  width:30px;
  height:30px;

  border:1px solid #9b876a60;
  border-radius:50%;

  color:#75634d;
  background:#eee3d5b0;

  padding:0;
  font-size:15px;
}

/* ========================================
   입체적인 책장 넘김
======================================== */

.flip-sheet{
  position:absolute;

  z-index:20;

  top:0;

  width:50%;
  height:100%;

  transform-style:preserve-3d;

  pointer-events:none;
}

.flip-sheet.forward{
  left:50%;

  transform-origin:left center;

  animation:
    turnForward .9s
    cubic-bezier(.35,.08,.25,1)
    forwards;
}

.flip-sheet.backward{
  left:0;

  transform-origin:right center;

  animation:
    turnBackward .9s
    cubic-bezier(.35,.08,.25,1)
    forwards;
}

.flip-face{
  position:absolute;
  inset:0;

  backface-visibility:hidden;

  overflow:hidden;

  box-shadow:
    8px 2px 20px #0002;
}

.flip-back{
  transform:rotateY(180deg);
}

@keyframes turnForward{

  from{
    transform:rotateY(0deg);
  }

  to{
    transform:rotateY(-180deg);
  }

}

@keyframes turnBackward{

  from{
    transform:rotateY(0deg);
  }

  to{
    transform:rotateY(180deg);
  }

}

.reader-footer{
  margin-top:24px;
}

.page-counter{
  font-family:Arial,sans-serif;

  font-size:11px;
  letter-spacing:4px;

  color:#c1ad96;
}

.reader-hint{
  margin-top:13px;

  font-size:11px;
  color:#8c8076;
}

/* ========================================
   마지막 장 이후 전체 보기
======================================== */

.view-all-button{
  display:block;

  margin:24px auto 0;
  padding:10px 24px;

  border:0;
  border-bottom:1px solid #b99a7580;
  background:transparent;

  font-size:14px;
  letter-spacing:2px;

  color:#ead8bd;

  transition:
    color .5s,
    text-shadow .5s;
}

.view-all-button:hover{
  color:#fff4df;

  text-shadow:
    0 0 12px #dfb78580;
}

/* ========================================
   전체 갤러리
======================================== */

.gallery-content{
  max-width:1000px;
  margin:0 auto;
}

.gallery{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:16px;

  margin:35px auto 0;
}

.gallery-item{
  display:block;

  position:relative;

  padding:0;

  border:0;
  background:#ffffff04;

  overflow:hidden;

  aspect-ratio:3/4;
}

.gallery-item img{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    filter .5s,
    transform .7s;
}

.gallery-item:hover img{
  transform:scale(1.035);
  filter:brightness(1.08);
}

.gallery-index{
  position:absolute;

  bottom:10px;
  left:12px;

  font-family:Arial,sans-serif;

  font-size:10px;
  letter-spacing:2px;

  color:#fff;

  text-shadow:0 1px 7px #000;
}

/* ========================================
   사진 확대
======================================== */

.lightbox{
  position:fixed;

  z-index:1000;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#08070bed;

  padding:35px 55px;
}

.lightbox-image{
  display:block;

  max-width:100%;
  max-height:85vh;

  object-fit:contain;

  box-shadow:0 10px 50px #0008;
}

.lightbox-close{
  position:absolute;

  top:20px;
  right:24px;

  width:38px;
  height:38px;

  border:0;
  background:transparent;

  font-size:28px;
  color:#eee1ce;
}

.lightbox-arrow{
  position:absolute;

  top:50%;
  transform:translateY(-50%);

  border:0;
  background:transparent;

  padding:10px;

  font-size:25px;
  color:#cbb49a;
}

.lightbox-prev{
  left:12px;
}

.lightbox-next{
  right:12px;
}

.lightbox-count{
  position:absolute;

  bottom:18px;
  left:0;
  right:0;

  text-align:center;

  font:10px Arial,sans-serif;

  letter-spacing:3px;
  color:#b7a28e;
}

/* ========================================
   모바일 반응형
======================================== */

@media(max-width:600px){

  .screen{
    padding:35px 22px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .quote{
    font-size:13px;
    line-height:1.6;
  }

  .eyebrow{
    font-size:9px;
    letter-spacing:3px;
  }

  .archive-title-image{
    width:120px;
    height:150px;
  }

  .archive-eyebrow{
    font-size:9px;
    letter-spacing:3px;
  }

  .cards{
    grid-template-columns:repeat(3,1fr);

    max-width:340px;
    gap:4px;

    margin-top:18px;
  }

  .card{
    min-height:130px;
    padding:8px 0;
  }

  .menu-symbol{
    width:74px;
    height:74px;

    max-width:100%;

    margin-bottom:10px;
  }

  .card small{
    font-size:7px;
    letter-spacing:.6px;
  }

  .card p{
    font-size:12px;
    margin-top:9px;
  }

  .flower-enter{
    width:130px;
    height:220px;
  }

  .flower-stage{
    transform:
      translateX(-50%) scale(.87);

    transform-origin:top center;
  }

  #archive .flower-enter{
    margin-top:20px;
  }

  .book-cover-button{
    width:min(280px,72vw);
  }

  .book{
    aspect-ratio:1.1;
    padding:5px;
  }

  .book-spine{
    width:13px;
  }

  .photo-frame{
    top:7%;
    bottom:13%;
    left:6%;
    right:6%;
  }

  .page-writing{
    padding:8%;
  }

  .photo-quote{
    font-size:12px;
    line-height:1.5;
  }

  .chapter-number{
    font-size:7px;
    letter-spacing:1px;
  }

  .page-decoration{
    font-size:15px;
    margin:12px 0;
  }

  .photo-number{
    font-size:7px;
    letter-spacing:1px;
  }

  .zoom-button{
    width:24px;
    height:24px;

    font-size:12px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .lightbox{
    padding:30px 35px;
  }

  .lightbox-arrow{
    font-size:20px;
    padding:3px;
  }

  .lightbox-prev{
    left:5px;
  }

  .lightbox-next{
    right:5px;
  }

}

/* ========================================
   움직임 최소화 설정
======================================== */

@media(prefers-reduced-motion:reduce){

  .falling-petal{
    animation:none!important;
    opacity:0!important;
  }

  .screen,
  .cover-leaf{
    transition-duration:.01s!important;
  }

  .flip-sheet{
    animation:none!important;
  }

  .book-cover-button .cover-leaf{
    transform:none!important;
  }

}

</style>
</head>


<body>

<!-- ========================================
     첫 화면
======================================== -->

<section class="screen" id="entrance">

  <div class="content">

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華"
    >

    <div class="quote">

      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>

      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.

    </div>

    <button
      class="flower-enter"
      type="button"
      data-target="archive"
      aria-label="기록 보관소 열기"
    ></button>

  </div>

</section>


<!-- ========================================

/* ========================================
   공통 상태
======================================== */

let currentScreen="entrance";
let transitioning=false;
let coverOpening=false;
let pageTurning=false;

const motionReduced=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

const fadeTime=motionReduced?10:1100;

const bookCoverButton=document.getElementById(
  "bookCoverButton"
);

function numberFormat(n){

  return String(n).padStart(2,"0");

}


/* ========================================
   이미지 경로 및 오류 보완
======================================== */

const assetVersion="v14";
const resolvedPhotos=new Map();

function imageURL(file){

  return "./"+
    encodeURIComponent(file)+
    "?v="+assetVersion;

}

function photoCandidates(index){

  const original=photos[index].src;

  const base=original.replace(
    /\.png$/i,
    ""
  );

  const shortBase=base.replace(
    /^portrait-0(\d)/,
    "portrait-$1"
  );

  return [...new Set([

    original,

    base+".PNG",

    base+"(1).png",

    base+" (1).png",

    shortBase+".png",

    original.replace(
      /^portrait/,
      "Portrait"
    )

  ])];

}

function getPhotoSource(index){

  return resolvedPhotos.get(index)||
    imageURL(photos[index].src);

}

function loadPortrait(img,index){

  if(img._portraitCleanup){

    img._portraitCleanup();

  }

  img.alt="유화의 모습 "+(index+1);

  let candidates=photoCandidates(index)
    .map(imageURL);

  const cached=resolvedPhotos.get(index);

  if(cached){

    candidates=[
      ...new Set([cached,...candidates])
    ];

  }

  let attempt=0;

  function cleanup(){

    img.removeEventListener(
      "load",
      onLoad
    );

    img.removeEventListener(
      "error",
      onError
    );

    img._portraitCleanup=null;

  }

  function onLoad(){

    resolvedPhotos.set(
      index,
      img.getAttribute("src")
    );

    cleanup();

  }

  function onError(){

    attempt++;

    if(attempt<candidates.length){

      img.src=candidates[attempt];

    }else{

      img.alt=
        "사진 파일을 불러올 수 없습니다: "+
        photos[index].src;

      cleanup();

      console.warn(
        "사진 경로 확인 필요:",
        photos[index].src
      );

    }

  }

  img._portraitCleanup=cleanup;

  img.addEventListener(
    "load",
    onLoad
  );

  img.addEventListener(
    "error",
    onError
  );

  img.src=candidates[0];

}


/* ========================================
   화면 전환
======================================== */

function goTo(target){

  if(
    transitioning||
    pageTurning||
    coverOpening
  )return;

  if(target===currentScreen)return;

  const next=document.getElementById(target);

  const previous=document.getElementById(
    currentScreen
  );

  if(!next||!previous)return;

  transitioning=true;

  resetPetalAnimations();

  if(document.activeElement instanceof HTMLElement){

    document.activeElement.blur();

  }

  previous.classList.add("fading");

  setTimeout(()=>{

    previous.classList.add("hidden");
    previous.classList.remove("fading");

    bookCoverButton.classList.remove(
      "opening"
    );

    next.classList.add("fading");
    next.classList.remove("hidden");

    currentScreen=target;

    window.scrollTo(0,0);

    requestAnimationFrame(()=>{

      requestAnimationFrame(()=>{

        next.classList.remove("fading");

        setTimeout(()=>{

          transitioning=false;

        },fadeTime);

      });

    });

  },fadeTime);

}

const petalSettings=[

function createPetalSVG(index){

}

  `;

  const layer=button.querySelector(
    ".petals-layer"
  );

  petalSettings.forEach((setting,index)=>{

    const [

      x,y,sway,drift,fall,
      delay,duration,rotate,end

    ]=setting;

    const petal=document.createElement(
      "span"
    );

    petal.className="falling-petal";

    petal.innerHTML=createPetalSVG(
      buttonIndex+"-"+index
    );

    const properties={

      "--start-x":x+"px",
      "--start-y":y+"px",
      "--sway":sway+"px",
      "--drift":drift+"px",
      "--fall":fall+"px",
      "--delay":delay+"s",
      "--duration":duration+"s",
      "--start-rotate":rotate+"deg",
      "--end-rotate":end+"deg"

    };

    Object.entries(properties).forEach(

      ([name,value])=>{

        petal.style.setProperty(
          name,
          value
        );

      }

    );

    layer.appendChild(petal);

  });

  button.addEventListener(
    "pointerenter",
    event=>{

      if(event.pointerType==="mouse"){

        startPetalAnimation(button);

      }

    }
  );

  button.addEventListener(
    "pointerleave",
    ()=>{

      button.classList.remove(
        "is-playing"
      );

    }
  );

  button.addEventListener(
    "focus",
    ()=>{

      if(button.matches(":focus-visible")){

        startPetalAnimation(button);

      }

    }
  );

  button.addEventListener(
    "blur",
    ()=>{

      button.classList.remove(
        "is-playing"
      );

    }
  );

  button.addEventListener(
    "click",
    ()=>{

      goTo(button.dataset.target);

    }
  );

});


function resetPetalAnimations(){

  flowerButtons.forEach(button=>{

    button.classList.remove(
      "is-playing"
    );

  });

}


function startPetalAnimation(button){

  if(
    transitioning||
    coverOpening||
    motionReduced
  )return;

  resetPetalAnimations();

  void button.offsetWidth;

  button.classList.add(
    "is-playing"
  );

}

======================================== */

function renderPage(){

  fillLeftPage(
    leftPage,
    currentPage
  );

  fillRightPage(
    rightPage,
    currentPage
  );

  pageCounter.textContent=

    numberFormat(currentPage+1)+

    " / "+

    numberFormat(photos.length);

  visitedPages.add(currentPage);

  if(
    currentPage===photos.length-1&&
    visitedPages.size===photos.length
  ){

    albumCompleted=true;

  }

  viewAllButton.classList.toggle(

    "hidden",

    !albumCompleted

  );

  leftPage.setAttribute(

    "aria-disabled",

    String(currentPage===0)

  );

  rightPage.setAttribute(

    "aria-disabled",

    String(currentPage===photos.length-1)

  );

  preloadAdjacent(currentPage);

}


/* ========================================
   책 표지 열기
======================================== */

function openAlbum(){

  if(

    transitioning||

    pageTurning||

    coverOpening||

    currentScreen!=="album-cover"

  )return;

  coverOpening=true;

  resetPetalAnimations();

  currentPage=0;

  renderPage();

  bookCoverButton.classList.add(
    "opening"
  );

  setTimeout(()=>{

    coverOpening=false;

    goTo("album-reader");

  },motionReduced?10:1000);

}


/* ========================================
   책장 넘김
======================================== */

function turnPage(direction){

  if(

    pageTurning||

    transitioning||

    coverOpening

  )return;

  if(
    currentScreen!=="album-reader"
  )return;

  if(
    !lightbox.classList.contains("hidden")
  )return;

  const nextPage=currentPage+direction;

  if(
    nextPage<0||
    nextPage>=photos.length
  )return;

  if(motionReduced){

    currentPage=nextPage;

    renderPage();

    return;

  }

  pageTurning=true;

  const oldPage=currentPage;

  const sheet=document.createElement(
    "div"
  );

  sheet.className=

    "flip-sheet "+

    (
      direction===1
      ?"forward"
      :"backward"
    );

  const front=document.createElement(
    "div"
  );

  const back=document.createElement(
    "div"
  );

  if(direction===1){

    front.className=
      "flip-face page page-right";

    back.className=
      "flip-face flip-back page page-left";

    fillRightPage(
      front,
      oldPage
    );

    fillLeftPage(
      back,
      nextPage,
      false
    );

    fillRightPage(
      rightPage,
      nextPage
    );

  }else{

    front.className=
      "flip-face page page-left";

    back.className=
      "flip-face flip-back page page-right";

    fillLeftPage(
      front,
      oldPage,
      false
    );

    fillRightPage(
      back,
      nextPage
    );

    fillLeftPage(
      leftPage,
      nextPage,
      false
    );

  }

  sheet.appendChild(front);
  sheet.appendChild(back);

  sheet.setAttribute(
    "aria-hidden",
    "true"
  );

  bookSpread.appendChild(sheet);

  let finished=false;

  function finishTurn(){

    if(finished)return;

    finished=true;

    currentPage=nextPage;

    sheet.remove();

    renderPage();

    pageTurning=false;

  }

  sheet.addEventListener(

    "animationend",

    finishTurn,

    {once:true}

  );

  setTimeout(finishTurn,1050);

}


/* ========================================
   좌우 페이지 클릭
======================================== */

let suppressClickUntil=0;

leftPage.addEventListener("click",()=>{

  if(Date.now()<suppressClickUntil)return;

  turnPage(-1);

});


rightPage.addEventListener("click",()=>{

  if(Date.now()<suppressClickUntil)return;

  turnPage(1);

});


leftPage.addEventListener(
  "keydown",
  event=>{

    if(event.target!==leftPage)return;

    if(
      event.key==="Enter"||
      event.key===" "
    ){

      event.preventDefault();

      turnPage(-1);

    }

  }
);


rightPage.addEventListener(
  "keydown",
  event=>{

    if(event.target!==rightPage)return;

    if(
      event.key==="Enter"||
      event.key===" "
    ){

      event.preventDefault();

      turnPage(1);

    }

  }
);


/* ========================================
   모바일 스와이프
======================================== */

let touchStartX=0;
let touchStartY=0;

const book=document.getElementById(
  "book"
);

book.addEventListener(

  "touchstart",

  event=>{

    touchStartX=

      event.changedTouches[0].clientX;

    touchStartY=

      event.changedTouches[0].clientY;

  },

  {passive:true}

);


book.addEventListener(

  "touchend",

  event=>{

    const dx=

      event.changedTouches[0].clientX-

      touchStartX;

    const dy=

      event.changedTouches[0].clientY-

      touchStartY;

    if(

      Math.abs(dx)>50&&

      Math.abs(dx)>Math.abs(dy)

    ){

      suppressClickUntil=
        Date.now()+500;

      turnPage(dx<0?1:-1);

    }

  },

  {passive:true}

);


/* ========================================
   전체 갤러리
======================================== */

const galleryGrid=document.getElementById(
  "galleryGrid"
);

function openGallery(){

  if(

    !albumCompleted||

    transitioning||

    pageTurning

  )return;

  galleryGrid.innerHTML="";

  photos.forEach((photo,index)=>{

    const item=document.createElement(
      "button"
    );

    item.type="button";

    item.className="gallery-item";

    item.setAttribute(

      "aria-label",

      "사진 "+(index+1)+" 확대"

    );

    item.innerHTML=`

      <img
        alt="유화의 모습 ${index+1}"
        loading="lazy"
      >

      <span class="gallery-index">

        ${numberFormat(index+1)}

      </span>

    `;

    loadPortrait(

      item.querySelector("img"),

      index

    );

    item.addEventListener(
      "click",
      ()=>{

        showLightbox(index,true);

      }
    );

    galleryGrid.appendChild(item);

  });

  goTo("gallery-screen");

}


/* ========================================
   사진 확대
======================================== */

let lightboxIndex=0;
let lightboxBrowseAll=false;
let lightboxPreviousFocus=null;

const lightbox=document.getElementById(
  "lightbox"
);

const lightboxImage=document.getElementById(
  "lightboxImage"
);

const lightboxCount=document.getElementById(
  "lightboxCount"
);


function showLightbox(index,allowAll){

  if(

    pageTurning||

    transitioning

  )return;

  lightboxIndex=index;

  lightboxBrowseAll=

    allowAll||albumCompleted;

  lightboxPreviousFocus=

    document.activeElement;

  lightbox.classList.remove(
    "hidden"
  );

  document.body.style.overflow=
    "hidden";

  updateLightbox();

  document.querySelector(
    ".lightbox-close"
  ).focus();

}


function updateLightbox(){

  loadPortrait(

    lightboxImage,

    lightboxIndex

  );

  lightboxCount.textContent=

    numberFormat(lightboxIndex+1)+

    " / "+

    numberFormat(photos.length);

  document.querySelectorAll(

    ".lightbox-arrow"

  ).forEach(button=>{

    button.classList.toggle(

      "hidden",

      !lightboxBrowseAll

    );

  });

}


function moveLightbox(direction){

  if(!lightboxBrowseAll)return;

  lightboxIndex=

    (

      lightboxIndex+

      direction+

      photos.length

    )%photos.length;

  updateLightbox();

}


function closeLightbox(){

  lightbox.classList.add(
    "hidden"
  );

  document.body.style.overflow="";

  if(
    lightboxPreviousFocus instanceof HTMLElement
  ){

    lightboxPreviousFocus.focus();

  }

}


lightbox.addEventListener(
  "click",
  event=>{

    if(event.target===lightbox){

      closeLightbox();

    }

  }
);


/* 확대 화면 스와이프 */

let lightboxTouchStart=0;

lightbox.addEventListener(

  "touchstart",

  event=>{

    lightboxTouchStart=

      event.changedTouches[0].clientX;

  },

  {passive:true}

);


lightbox.addEventListener(

  "touchend",

  event=>{

    const dx=

      event.changedTouches[0].clientX-

      lightboxTouchStart;

    if(Math.abs(dx)>50){

      moveLightbox(dx<0?1:-1);

    }

  },

  {passive:true}

);


/* ========================================
   키보드 지원
======================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      !lightbox.classList.contains("hidden")
    ){

      if(event.key==="Escape"){

        closeLightbox();

      }

      if(event.key==="ArrowLeft"){

        event.preventDefault();

        moveLightbox(-1);

      }

      if(event.key==="ArrowRight"){

        event.preventDefault();

        moveLightbox(1);

      }

      if(event.key==="Tab"){

        const controls=[

          ...lightbox.querySelectorAll(

            "button:not(.hidden)"

          )

        ];

        const first=controls[0];

        const last=

          controls[controls.length-1];

        if(

          event.shiftKey&&

          document.activeElement===first

        ){

          event.preventDefault();

          last.focus();

        }else if(

          !event.shiftKey&&

          document.activeElement===last

        ){

          event.preventDefault();

          first.focus();

        }

      }

      return;

    }


    if(
      currentScreen==="album-reader"
    ){

      if(event.key==="ArrowLeft"){

        event.preventDefault();

        turnPage(-1);

      }

      if(event.key==="ArrowRight"){

        event.preventDefault();

        turnPage(1);

      }

    }

  }
);

</script>
