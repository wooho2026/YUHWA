
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>留華 | 850년의 기록</title>

<!-- 마루부리 웹폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>

/* ==================================
   기본 설정
================================== */

:root{
  --bg:#0d0c10;
  --gold:#b99a75;
  --ivory:#eee7dc;
  --muted:#c9beb2;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--ivory);
  font-family:"Maru Buri","Malgun Gothic",serif;
}

button{
  font:inherit;
  cursor:pointer;
}

/* ==================================
   공통 화면
================================== */

.screen{
  min-height:100vh;
  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  position:relative;
  overflow:hidden;
  padding:30px;

  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
}

/* ==================================
   유화 붓글씨
================================== */

.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;

  filter:drop-shadow(
    0 0 22px #d8bda426
  );
}

.subtitle{
  font-size:15px;
  font-weight:400;
  letter-spacing:2px;
  color:#c4b29e;
  margin-top:20px;
}

/* ==================================
   본문 문구
================================== */

.quote{
  margin-top:28px;

  font-size:14px;
  font-weight:400;
  line-height:1.7;

  color:var(--muted);
  word-break:keep-all;
}

/* ==================================
   V6 꽃 버튼
================================== */

.flower-enter{
  position:relative;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  margin-top:22px;
  padding:20px;

  border:0;
  background:transparent;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.flower-stage{
  position:relative;

  width:158px;
  height:158px;

  display:grid;
  place-items:center;

  isolation:isolate;
}

/* 꽃의 은은한 후광 */

.flower-stage::before{
  content:"";
  position:absolute;
  inset:-18px;

  border-radius:50%;

  background:radial-gradient(
    circle,
    rgba(240,220,181,.12) 0%,
    rgba(226,196,152,.05) 38%,
    transparent 72%
  );

  pointer-events:none;

  transition:opacity .7s;
}

/* 꽃 이미지들을 동일한 위치에 배치 */

.flower-main,
.flower-ghost-one,
.flower-ghost-two{
  grid-area:1/1;

  display:block;
  width:142px;
  height:142px;

  object-fit:contain;

  pointer-events:none;
}

/* 실제 꽃 */

.flower-main{
  position:relative;
  z-index:3;

  opacity:1;
  filter:blur(0);

  transform:translate(0,0);

  will-change:filter,opacity,transform;
}

/* 첫 번째 꽃 잔상 */

.flower-ghost-one{
  position:relative;
  z-index:2;

  opacity:0;
  filter:blur(0);

  will-change:filter,opacity,transform;
}

/* 두 번째 꽃 잔상 */

.flower-ghost-two{
  position:relative;
  z-index:1;

  opacity:0;
  filter:blur(0);

  will-change:filter,opacity,transform;
}

/* ==================================
   꽃 잔상 애니메이션
================================== */

/* 호버하면 실제 꽃이 흐려졌다가 선명해짐 */

.flower-enter:hover .flower-main,
.flower-enter:focus-visible .flower-main{
  animation:flowerReveal 1.8s ease-out both;
}

/* 첫 번째 잔상 */

.flower-enter:hover .flower-ghost-one,
.flower-enter:focus-visible .flower-ghost-one{
  animation:flowerGhostOne 1.8s ease-out both;
}

/* 두 번째 잔상 */

.flower-enter:hover .flower-ghost-two,
.flower-enter:focus-visible .flower-ghost-two{
  animation:flowerGhostTwo 1.8s ease-out both;
}

/* 본체 : 희미해졌다 다시 선명해짐 */

@keyframes flowerReveal{

  0%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

  18%{
    opacity:.28;
    filter:blur(7px);
    transform:scale(.98);
  }

  45%{
    opacity:.48;
    filter:blur(4px);
    transform:scale(1);
  }

  75%{
    opacity:.85;
    filter:blur(1.5px);
    transform:scale(1);
  }

  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

}

/* 잔상 1 : 오른쪽 위로 확산 */

@keyframes flowerGhostOne{

  0%{
    opacity:0;
    filter:blur(0);
    transform:translate(0,0) scale(1);
  }

  20%{
    opacity:.48;
    filter:blur(4px);
    transform:translate(4px,-3px) scale(1.04);
  }

  48%{
    opacity:.3;
    filter:blur(9px);
    transform:translate(10px,-8px) scale(1.09);
  }

  100%{
    opacity:0;
    filter:blur(17px);
    transform:translate(18px,-14px) scale(1.15);
  }

}

/* 잔상 2 : 왼쪽 아래로 확산 */

@keyframes flowerGhostTwo{

  0%{
    opacity:0;
    filter:blur(0);
    transform:translate(0,0) scale(1);
  }

  22%{
    opacity:.36;
    filter:blur(5px);
    transform:translate(-5px,4px) scale(1.03);
  }

  52%{
    opacity:.22;
    filter:blur(10px);
    transform:translate(-11px,9px) scale(1.08);
  }

  100%{
    opacity:0;
    filter:blur(18px);
    transform:translate(-18px,15px) scale(1.14);
  }

}

/* 키보드 접근성 */

.flower-enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:6px;
}

/* ==================================
   기록 보관소
================================== */

.hidden{
  display:none!important;
}

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:28px;
}

.archive-title{
  font-size:65px;
  font-weight:400;
  color:#e9ddc8;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;

  max-width:760px;
  margin:40px auto 0;
}

.card{
  border:1px solid #66594c;
  padding:35px 12px;
  background:#ffffff05;
  min-height:160px;

  transition:
    background .3s,
    border-color .3s;
}

.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
}

.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}

.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#bba992;
}

.card p{
  font-size:13px;
}

.note{
  font-size:11px;
  color:#8c8076;
  margin-top:35px;
}

/* ==================================
   돌아가기 버튼
================================== */

.enter{
  position:relative;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:22px;

  margin-top:43px;
  padding:19px 32px;

  border:0;
  background:transparent;

  color:#e9d8c2;
  font-size:15px;
  letter-spacing:4px;

  overflow:hidden;

  transition:
    color .5s,
    letter-spacing .5s;
}

.enter::before,
.enter::after{
  content:"";
  position:absolute;

  left:12%;
  right:12%;
  height:1px;

  background:linear-gradient(
    90deg,
    transparent,
    #b99a75,
    transparent
  );

  transition:
    left .6s,
    right .6s,
    box-shadow .6s;
}

.enter::before{
  top:0;
}

.enter::after{
  bottom:0;
}

.enter:hover{
  color:#fff6e7;
  letter-spacing:6px;
  text-shadow:0 0 16px #e6c69c80;
}

.enter:hover::before,
.enter:hover::after{
  left:0;
  right:0;
  box-shadow:0 0 12px #d6ad8066;
}

.enter .arrow{
  font-family:Arial,sans-serif;
  font-size:18px;
  color:#bda181;

  transition:transform .5s;
}

.enter:hover .arrow{
  transform:translate(4px,-4px);
}

.enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:6px;
}

/* ==================================
   페이드 화면 전환
================================== */

#entrance,
#archive{
  transition:opacity 1.1s ease;
}

#archive{
  opacity:0;
}

#archive.visible{
  opacity:1;
}

#entrance.fading{
  opacity:0;
}

/* ==================================
   모바일
================================== */

@media(max-width:600px){

  .screen{
    padding:35px 25px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .subtitle{
    font-size:14px;
  }

  .quote{
    font-size:13px;
    line-height:1.6;
  }

  .flower-stage{
    width:132px;
    height:132px;
  }

  .flower-main,
  .flower-ghost-one,
  .flower-ghost-two{
    width:122px;
    height:122px;
  }

  .cards{
    grid-template-columns:1fr;
    max-width:290px;
  }

}

/* ==================================
   움직임 최소화 설정
================================== */

@media(prefers-reduced-motion:reduce){

  #entrance,
  #archive{
    transition-duration:.01s;
  }

  .flower-main,
  .flower-ghost-one,
  .flower-ghost-two{
    animation:none!important;
  }

  .flower-ghost-one,
  .flower-ghost-two{
    opacity:0!important;
  }

  .flower-main{
    opacity:1!important;
    filter:none!important;
    transform:none!important;
  }

}

</style>
</head>

<body>

<!-- ==================================
     첫 화면
================================== -->

<section class="screen" id="entrance">

  <div class="content">

    <!-- 기존 유화 붓글씨 -->
    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華 붓글씨"
    >

    <div class="subtitle">
      850년의 기록
    </div>

    <!-- 본문 문구 -->
    <div class="quote">
      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>
      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.
    </div>

    <!-- 꽃 자체가 입장 버튼 -->
    <button
      class="flower-enter"
      type="button"
      onclick="openDoor()"
      aria-label="꽃을 눌러 기록 보관소 열기"
      title="기록 보관소 열기"
    >

      <span class="flower-stage">

        <!-- 첫 번째 꽃 잔상 -->
        <img
          class="flower-ghost-one"
          src="flower.png"
          alt=""
          aria-hidden="true"
        >

        <!-- 두 번째 꽃 잔상 -->
        <img
          class="flower-ghost-two"
          src="flower.png"
          alt=""
          aria-hidden="true"
        >

        <!-- 실제 꽃 -->
        <img
          class="flower-main"
          src="flower.png"
          alt=""
        >

      </span>

    </button>

  </div>

</section>


<!-- ==================================
     기록 보관소
================================== -->

<section class="screen hidden" id="archive">

  <div class="content">

    <div class="eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <div class="archive-title">
      留華
    </div>

    <div class="subtitle">
      이제야 보여줄 수 있는 것들
    </div>

    <div class="cards">

      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <button
      class="enter"
      type="button"
      onclick="closeDoor()"
    >
      돌아가기
      <span class="arrow">↗</span>
    </button>

  </div>

</section>


<!-- ==================================
     JavaScript 화면 전환
================================== -->

<script>

let transitioning=false;

function openDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  entrance.classList.add("fading");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{

    entrance.classList.add("hidden");
    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{

      requestAnimationFrame(()=>{

        archive.classList.add("visible");
        transitioning=false;

      });

    });

  },reduced?20:1100);

}

function closeDoor(){

  if(transitioning)return;

  transitioning=true;

  const entrance=
    document.getElementById("entrance");

  const archive=
    document.getElementById("archive");

  archive.classList.remove("visible");

  const reduced=window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  setTimeout(()=>{

    archive.classList.add("hidden");
    entrance.classList.remove("hidden");
    entrance.classList.remove("fading");

    transitioning=false;

  },reduced?20:1100);

}

</script>

</body>
</html>
