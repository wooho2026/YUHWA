
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>留華 | 850년의 기록</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/fonts-archive/MaruBuri/MaruBuri.css">

<style>
:root{
  --bg:#0d0c10;
  --ivory:#eee7dc;
  --muted:#c9beb2;
  --gold:#b99a75;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:"Maru Buri","Malgun Gothic",serif;
  color:var(--ivory);
}

button{
  font:inherit;
  cursor:pointer;
}

/* =====================================
   공통 화면
===================================== */

.screen{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow-x:hidden;
  overflow-y:auto;
  padding:40px 30px;
  text-align:center;
  background:radial-gradient(
    ellipse at 50% 40%,
    #292329,
    #0d0c10 75%
  );
}

.screen::before{
  content:"";
  position:absolute;
  inset:18px;
  border:1px solid #ffffff14;
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
}

.hidden{
  display:none!important;
}

/* =====================================
   메인 붓글씨
===================================== */

.title-image{
  display:block;
  width:min(250px,62vw);
  height:clamp(230px,43vh,390px);
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(0 0 22px #d8bda426);
}

/* 메인 문구 */

.quote{
  margin-top:28px;
  font-size:14px;
  font-weight:400;
  line-height:1.7;
  color:var(--muted);
  word-break:keep-all;
}

/* =====================================
   V10 공통 꽃 버튼
===================================== */

.flower-enter{
  display:grid;
  place-items:center;
  position:relative;
  width:250px;
  height:250px;
  margin:6px auto 0;
  padding:0;
  border:0;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
}

.flower-stage{
  display:block;
  position:relative;
  width:250px;
  height:250px;
  pointer-events:none;
}

/* 원본 꽃 : 변형하지 않음 */

.flower-main{
  position:absolute;
  display:block;
  z-index:2;
  width:150px;
  height:150px;
  top:5px;
  left:50%;
  transform:translateX(-50%);
  object-fit:contain;
  filter:drop-shadow(
    0 0 8px rgba(245,226,202,.13)
  );
}

/* 꽃잎 레이어 */

.petals-layer{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.falling-petal{
  position:absolute;
  left:50%;
  top:80px;
  width:19px;
  height:34px;
  opacity:0;
  transform-origin:50% 15%;
  pointer-events:none;
}

.falling-petal svg{
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(
    0 2px 3px rgba(238,220,196,.12)
  );
}

/* 두 버튼 모두 동일한 재생 클래스 사용 */

.flower-enter.is-playing .falling-petal{
  animation:
    petalFall var(--duration) ease-in-out
    var(--delay) both;
}

/* 꽃잎 낙하 : 양쪽 공통 */

@keyframes petalFall{

  0%{
    opacity:0;
    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      rotate(var(--start-rotate))
      scale(.85);
  }

  12%{
    opacity:1;
  }

  30%{
    opacity:.95;
    transform:
      translate(
        calc(var(--start-x) + var(--sway)),
        calc(var(--start-y) + 35px)
      )
      rotate(45deg)
      scale(1);
  }

  60%{
    opacity:.85;
    transform:
      translate(
        calc(var(--start-x) - var(--sway)),
        calc(var(--start-y) + 85px)
      )
      rotate(125deg)
      scale(.9);
  }

  85%{
    opacity:.5;
  }

  100%{
    opacity:0;
    transform:
      translate(
        calc(var(--start-x) + var(--drift)),
        calc(var(--start-y) + var(--fall))
      )
      rotate(var(--end-rotate))
      scale(.7);
  }
}

.flower-enter:focus-visible{
  outline:1px solid #d9b78f;
  outline-offset:4px;
}

/* =====================================
   기록 보관소
===================================== */

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:5px;
  color:#ad9c89;
  margin-bottom:22px;
}

/* V10 : 동일한 붓글씨 이미지 사용 */

.archive-title-image{
  display:block;
  width:150px;
  height:175px;
  object-fit:contain;
  margin:0 auto;
  filter:drop-shadow(0 0 14px #d8bda41e);
}

/* =====================================
   기록 카드
===================================== */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:760px;
  margin:28px auto 0;
}

.card{
  border:1px solid #66594c;
  border-radius:14px;
  padding:35px 12px;
  min-height:160px;
  background:#ffffff05;
  transition:
    background .3s,
    border-color .3s,
    box-shadow .3s;
}

.card:hover{
  background:#ffffff0b;
  border-color:#a58b71;
  box-shadow:0 0 22px rgba(185,154,117,.07);
}

.card span{
  display:block;
  font-size:30px;
  margin-bottom:20px;
}

.card small{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:#bba992;
}

.card p{
  font-size:13px;
}

.note{
  font-size:11px;
  color:#8c8076;
  margin-top:30px;
}

/* 기록 보관소 꽃 버튼 */

.archive-flower{
  margin-top:0;
}

/* =====================================
   화면 전환
===================================== */

#entrance,
#archive{
  transition:opacity 1.1s ease;
}

#archive{
  opacity:0;
}

#archive.visible{
  opacity:1;
}

#entrance.fading{
  opacity:0;
}

/* =====================================
   모바일
===================================== */

@media(max-width:600px){

  .screen{
    padding:35px 25px;
  }

  .title-image{
    height:clamp(210px,38vh,330px);
  }

  .quote{
    font-size:13px;
    line-height:1.6;
  }

  .archive-title-image{
    width:120px;
    height:150px;
  }

  .cards{
    grid-template-columns:1fr;
    max-width:290px;
    margin-top:24px;
  }

  .card{
    min-height:125px;
    padding:22px 12px;
  }

  .card span{
    margin-bottom:12px;
  }

  .flower-enter{
    width:220px;
    height:220px;
    margin-top:5px;
  }

  .flower-stage{
    transform:scale(.87);
    transform-origin:top center;
  }

  .archive-flower{
    margin-top:0;
  }
}

/* 접근성 : 움직임 최소화 */

@media(prefers-reduced-motion:reduce){

  .falling-petal{
    animation:none!important;
    opacity:0!important;
  }

  #entrance,
  #archive{
    transition-duration:.01s;
  }
}

</style>
</head>

<body>

<!-- =====================================
     첫 화면
===================================== -->

<section class="screen" id="entrance">
  <div class="content">

    <img
      class="title-image"
      src="yuhwa-title.png"
      alt="留華 붓글씨"
    >

    <div class="quote">
      빛 한 줄기 들지 않는 시간을 홀로 견뎌냈다.<br>
      끝 모를 고독의 끝자락에서, 마침내 너를 만났다.
    </div>

    <!-- 꽃 클릭 : 기록 보관소 입장 -->

    <button
      class="flower-enter"
      type="button"
      onclick="openDoor()"
      aria-label="기록 보관소 열기"
    >
      <span class="flower-stage">

        <img
          class="flower-main"
          src="flower.png"
          alt=""
        >

        <span
          class="petals-layer"
          aria-hidden="true"
        ></span>

      </span>
    </button>

  </div>
</section>

<!-- =====================================
     기록 보관소
===================================== -->

<section class="screen hidden" id="archive">
  <div class="content">

    <div class="eyebrow">
      THE ARCHIVE OF YUHWA
    </div>

    <!-- V10 : 메인과 동일한 붓글씨 -->

    <img
      class="archive-title-image"
      src="yuhwa-title.png"
      alt="留華 붓글씨"
    >

    <!-- 둥근 카드 3개 -->

    <div class="cards">

      <div class="card">
        <span>壹</span>
        <small>THE PORTRAITS</small>
        <p>그의 모습</p>
      </div>

      <div class="card">
        <span>貳</span>
        <small>THE MEMORIES</small>
        <p>오래된 기억</p>
      </div>

      <div class="card">
        <span>參</span>
        <small>THE VOICE</small>
        <p>그의 목소리</p>
      </div>

    </div>

    <p class="note">
      기록은 아직 잠들어 있다.
    </p>

    <!-- 메인과 동일한 꽃 + 동일한 애니메이션 -->

    <button
      class="flower-enter archive-flower"
      type="button"
      onclick="closeDoor()"
      aria-label="첫 화면으로 돌아가기"
    >
      <span class="flower-stage">

        <img
          class="flower-main"
          src="flower.png"
          alt=""
        >

        <span
          class="petals-layer"
          aria-hidden="true"
        ></span>

      </span>
    </button>

  </div>
</section>

<script>

/* =====================================
   양쪽 공통 꽃잎 8장
===================================== */

const petalSettings=[

  {
    x:-63,y:0,sway:-13,drift:-39,
    fall:136,delay:0,duration:2.8,
    rotate:-25,end:-205
  },

  {
    x:46,y:10,sway:16,drift:48,
    fall:150,delay:.21,duration:3.1,
    rotate:38,end:260
  },

  {
    x:-37,y:27,sway:18,drift:-18,
    fall:125,delay:.43,duration:2.9,
    rotate:-42,end:190
  },

  {
    x:65,y:-8,sway:-17,drift:28,
    fall:148,delay:.62,duration:3.2,
    rotate:55,end:300
  },

  {
    x:12,y:36,sway:12,drift:-25,
    fall:122,delay:.83,duration:2.7,
    rotate:15,end:-210
  },

  {
    x:-53,y:19,sway:-12,drift:-45,
    fall:157,delay:1.04,duration:3.2,
    rotate:-35,end:-260
  },

  {
    x:34,y:29,sway:18,drift:39,
    fall:137,delay:1.25,duration:3.0,
    rotate:30,end:240
  },

  {
    x:-8,y:43,sway:-16,drift:15,
    fall:149,delay:1.46,duration:3.1,
    rotate:-15,end:210
  }
];

/* =====================================
   꽃잎 SVG 생성
===================================== */

function createPetalSVG(index){

  const gradientId="petal-gradient-"+index;

  return `
  <svg viewBox="0 0 36 66"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
      <linearGradient
        id="${gradientId}"
        x1="0" y1="0" x2="1" y2="1">

        <stop offset="0%"
          stop-color="#fffdf8"/>

        <stop offset="45%"
          stop-color="#f2ede3"/>

        <stop offset="100%"
          stop-color="#d6c8b6"/>

      </linearGradient>
    </defs>

    <path
      d="
        M18 3
        C31 17 36 37 23 56
        Q19 63 16 62
        C2 46 1 24 18 3
        Z
      "
      fill="url(#${gradientId})"
    />

    <path
      d="M18 9 Q24 35 18 57"
      fill="none"
      stroke="#d1c4b3"
      stroke-width=".8"
      opacity=".38"
    />

    <path
      d="M16 15 Q9 36 16 52"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.4"
      opacity=".45"
    />

  </svg>`;
}

/* =====================================
   두 꽃에 동일한 꽃잎 생성
===================================== */

const flowerButtons=[
  ...document.querySelectorAll(".flower-enter")
];

flowerButtons.forEach((button,buttonIndex)=>{

  const layer=button.querySelector(".petals-layer");

  petalSettings.forEach((p,index)=>{

    const petal=document.createElement("span");

    petal.className="falling-petal";

    petal.innerHTML=createPetalSVG(
      buttonIndex+"-"+index
    );

    const properties={
      "--start-x":p.x+"px",
      "--start-y":p.y+"px",
      "--sway":p.sway+"px",
      "--drift":p.drift+"px",
      "--fall":p.fall+"px",
      "--delay":p.delay+"s",
      "--duration":p.duration+"s",
      "--start-rotate":p.rotate+"deg",
      "--end-rotate":p.end+"deg"
    };

    Object.entries(properties).forEach(
      ([name,value])=>{
        petal.style.setProperty(name,value);
      }
    );

    layer.appendChild(petal);

  });

});

/* =====================================
   V10 애니메이션 초기화
===================================== */

let transitioning=false;

const motionReduced=window.matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;

/* 양쪽 꽃 상태 동시 초기화 */

function resetPetalAnimations(){

  flowerButtons.forEach(button=>{
    button.classList.remove("is-playing");
  });

}

/* 처음부터 재생 */

function startPetalAnimation(button){

  if(transitioning || motionReduced)return;

  const screen=button.closest(".screen");

  if(screen.classList.contains("hidden"))return;

  resetPetalAnimations();

  /* 기존 애니메이션 프레임 초기화 */
  void button.offsetWidth;

  button.classList.add("is-playing");

}

/* 마우스 진입/이탈 */

flowerButtons.forEach(button=>{

  button.addEventListener("pointerenter",event=>{

    if(event.pointerType==="mouse"){
      startPetalAnimation(button);
    }

  });

  button.addEventListener("pointerleave",()=>{
    button.classList.remove("is-playing");
  });

  /* 키보드 Tab 접근 시 재생 */
  button.addEventListener("focus",event=>{
    if(!button.matches(":focus-visible"))return;
    startPetalAnimation(button);
  });

  button.addEventListener("blur",()=>{
    button.classList.remove("is-playing");
  });

});

/* =====================================
   기존 화면 전환
===================================== */

function openDoor(){

  if(transitioning)return;
  transitioning=true;

  const entrance=document.getElementById("entrance");
  const archive=document.getElementById("archive");

  /* 이전 꽃잎 애니메이션 제거 */
  resetPetalAnimations();

  /* 클릭 포커스 해제 */
  if(document.activeElement instanceof HTMLElement){
    document.activeElement.blur();
  }

  entrance.classList.add("fading");

  setTimeout(()=>{

    entrance.classList.add("hidden");
    archive.classList.remove("hidden");

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        archive.classList.add("visible");
        transitioning=false;
      });
    });

  },motionReduced?20:1100);

}

function closeDoor(){

  if(transitioning)return;
  transitioning=true;

  const entrance=document.getElementById("entrance");
  const archive=document.getElementById("archive");

  resetPetalAnimations();

  if(document.activeElement instanceof HTMLElement){
    document.activeElement.blur();
  }

  archive.classList.remove("visible");

  setTimeout(()=>{

    archive.classList.add("hidden");
    entrance.classList.remove("hidden");
    entrance.classList.remove("fading");

    /* 재진입 때도 항상 처음 상태 */
    resetPetalAnimations();

    transitioning=false;

  },motionReduced?20:1100);

}

</script>
</body>
</html>
